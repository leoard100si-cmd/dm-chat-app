<style>
  :root{
    --bg:#313338;
    --bg-sidebar:#2b2d31;
    --bg-sidebar-dark:#1e1f22;
    --bg-input:#383a40;
    --border:#26282c;
    --text:#dbdee1;
    --text-bright:#f2f3f5;
    --text-dim:#949ba4;
    --blurple:#5865f2;
    --blurple-hover:#4752c4;
    --online:#23a55a;
    --danger:#f23f42;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"gg sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{height:100%;display:flex;flex-direction:column;}

  /* ---------- TELA DE LOGIN ---------- */
  #login{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;background:var(--bg-sidebar-dark);
  }
  #login h1{
    font-size:28px;margin:0;color:var(--text-bright);font-weight:700;
  }
  #login p.sub{color:var(--text-dim);margin:-8px 0 10px;font-size:15px;}
  #login input{
    width:100%;max-width:280px;padding:12px 14px;border-radius:22px;
    border:1px solid var(--border);background:var(--bg-sidebar);color:var(--text-bright);
    font-size:15px;outline:none;
  }
  #login input:focus{border-color:var(--blurple);}
  #login button{
    width:100%;max-width:280px;padding:12px;border-radius:22px;border:none;
    background:var(--blurple);color:#fff;font-weight:600;font-size:15px;
    cursor:pointer;
  }
  #login button:active{background:var(--blurple-hover);}
  #loginError{color:var(--danger);font-size:13px;min-height:18px;}

  /* ---------- LISTA DE CONVERSAS ---------- */
  #listView{height:100%;display:flex;flex-direction:column;background:var(--bg-sidebar);}
  #listHeader{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px;border-bottom:1px solid var(--border);background:var(--bg-sidebar-dark);
    border-radius:0 0 18px 18px;
  }
  #listHeader h2{margin:0;font-size:16px;color:var(--text-bright);font-weight:700;}
  #logoutBtn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;}
  #listHeader .myProfile{display:flex;align-items:center;gap:10px;cursor:pointer;}
  #chatHeaderAvatar{width:32px;height:32px;flex-shrink:0;}
  #chatHeaderAvatar .avatar{width:32px;height:32px;font-size:13px;}
  #chatList{flex:1;overflow-y:auto;padding:8px;}
  .chatItem{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;cursor:pointer;
  }
  .chatItem:active{background:var(--bg-input);}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--blurple);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    color:#fff;flex-shrink:0;font-size:15px;position:relative;overflow:visible;
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  .statusDot{
    position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
    background:var(--text-dim);border:2.5px solid var(--bg-sidebar);
  }
  .statusDot.online{background:var(--online);}
  .msg .avatar .statusDot{border-color:var(--bg);}
  #chatHeaderAvatar .statusDot{border-color:var(--bg);}
  .chatItem .info{flex:1;min-width:0;}
  .chatItem .name{font-weight:600;font-size:15px;color:var(--text-bright);}
  .chatItem .preview{color:var(--text-dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- TELA DE CHAT ---------- */
  #chatView{height:100%;display:none;flex-direction:column;background:var(--bg);}
  #chatHeader{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:var(--bg);box-shadow:0 1px 0 rgba(0,0,0,.15);
    border-radius:0 0 18px 18px;
  }
  #backBtn{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:0 4px;}
  #chatHeader .name.channel:before{content:"# ";color:var(--text-dim);}
  #chatHeader .name{font-weight:700;font-size:16px;color:var(--text-bright);}
  #messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:2px;}
  .msg{
    display:flex;gap:14px;padding:8px 10px;border-radius:18px;font-size:15px;line-height:1.4;
    position:relative;
  }
  .msg:hover{background:rgba(0,0,0,.08);}
  .msg.highlight{background:rgba(88,101,242,.25);}
  .msg .avatar{margin-top:2px;}
  .msg .body{flex:1;min-width:0;}
  .msg .head{display:flex;align-items:baseline;gap:8px;}
  .msg .sender{font-size:15px;color:var(--text-bright);font-weight:600;}
  .msg.me .sender{color:var(--blurple);}
  .msg .time{font-size:11px;color:var(--text-dim);}
  .msg .editedTag{font-size:10.5px;color:var(--text-dim);}
  .msg .content{color:var(--text);word-break:break-word;}
  .msg .content.deletedNote{color:var(--text-dim);font-style:italic;}
  .msg img,.msg video{max-width:320px;max-height:320px;border-radius:20px;display:block;margin-top:4px;}
  .msg audio{width:260px;margin-top:4px;border-radius:24px;}
  .msg a.fileLink{color:#00a8fc;text-decoration:underline;word-break:break-all;}
  .msg .renameNote{color:var(--text-dim);font-size:11.5px;margin-top:3px;}
  .msg .quote{
    border-left:3px solid var(--blurple);padding:4px 10px;margin-bottom:4px;
    background:rgba(88,101,242,.08);border-radius:6px;font-size:12.5px;
    color:var(--text-dim);cursor:pointer;max-width:280px;
  }
  .msg .quote b{color:var(--text-bright);display:block;font-size:12.5px;}
  .msg .actions{
    display:flex;gap:4px;align-self:flex-start;opacity:.55;flex-shrink:0;
  }
  .msg .actions button{
    background:var(--bg-input);border:none;color:var(--text-dim);
    width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0;
  }
  .msg .actions button:active{opacity:1;background:var(--blurple);color:#fff;}

  #replyBar{
    display:none;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 16px;background:var(--bg-input);border-left:3px solid var(--blurple);
    margin:0 16px;border-radius:10px 10px 0 0;font-size:12.5px;color:var(--text-dim);
  }
  #replyBar b{color:var(--text-bright);}
  #replyBar button{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;flex-shrink:0;}

  #inputBar{
    display:flex;align-items:center;gap:8px;padding:12px 16px 16px;background:var(--bg);
  }
  #inputBar input[type=text]{
    flex:1;padding:12px 16px;border-radius:24px;border:none;
    background:var(--bg-input);color:var(--text-bright);font-size:15px;outline:none;
  }
  #attachBtn,#sendBtn{
    background:none;border:none;color:var(--text-dim);
    width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;
  }
  #attachBtn:active,#sendBtn:active{background:var(--bg-input);}
  #sendBtn{color:var(--blurple);}
  #fileInput{display:none;}
  #uploadStatus{
    text-align:center;font-size:12px;color:var(--text-dim);padding:4px;display:none;
  }


  /* ---------- CENTRAL DE ANIME (teste) ---------- */
  #animeModal{
    position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
    padding:12px;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  }
  #animePanel{
    width:min(1100px,100%);height:min(900px,96vh);display:flex;flex-direction:column;
    overflow:hidden;background:var(--bg);border:1px solid var(--border);border-radius:18px;
    box-shadow:0 24px 90px rgba(0,0,0,.65);
  }
  #animeHeader{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  #animeHeader .name{font-weight:800;font-size:16px;color:var(--text-bright);flex:1;}
  #animeClose{background:var(--bg-input);border:0;color:var(--text-dim);width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer;}
  #animeSearchWrap{padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  #animeSearch{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid var(--border);border-radius:12px;
    background:var(--bg-input);color:var(--text-bright);outline:none;font-size:14px;}
  #animeResults{overflow-y:auto;padding:12px 16px 18px;flex:1;}
  .animeCard{border:1px solid var(--border);background:var(--bg-sidebar);border-radius:14px;padding:14px;margin-bottom:10px;}
  .animeTitle{font-weight:800;color:var(--text-bright);font-size:15px;margin-bottom:6px;}
  .animeMeta{font-size:12px;color:var(--text-dim);margin-bottom:10px;}
  .animeEpisodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .animeEp{padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);
    color:var(--text-bright);cursor:pointer;font-size:13px;text-align:center;}
  .animeEp:active{transform:scale(.98);}
  .animeEmpty{padding:28px 8px;text-align:center;color:var(--text-dim);font-size:13px;}
  #animeFrameWrap{display:none;flex:1;min-height:0;background:#000;position:relative;}
  #animeFrame{width:100%;height:100%;border:0;display:block;background:#000;}
  #animeFrameFallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:rgba(0,0,0,.86);color:var(--text-dim);font-size:13px;}
  #animeFrameFallback button{margin-top:12px;padding:10px 14px;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);color:var(--text-bright);cursor:pointer;}

  .animeSearchResult{width:100%;display:flex;gap:12px;text-align:left;border:1px solid var(--border);background:var(--bg-sidebar);border-radius:14px;padding:10px;margin-bottom:10px;color:var(--text);cursor:pointer;}
  .animeSearchResult:active{transform:scale(.995);}
  .animePosterWrap{width:58px;height:78px;border-radius:9px;overflow:hidden;background:var(--bg-input);flex-shrink:0;}
  .animePosterWrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .animePosterFallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;font-size:25px;}
  .animeSearchInfo{min-width:0;flex:1;display:flex;flex-direction:column;justify-content:center;}
  .animeSearchInfo .animeTitle{margin-bottom:4px;}
  .animeHint{font-size:12px;color:var(--blurple);margin-top:4px;}
  .animeBackRow{margin-bottom:10px;}
  .animeBackRow button,.animeMore{border:1px solid var(--border);background:var(--bg-input);color:var(--text-bright);padding:9px 12px;border-radius:10px;cursor:pointer;}
  .animeSelectedTitle{font-weight:800;color:var(--text-bright);font-size:18px;margin-bottom:3px;}
  .animeSelectedMeta{margin-bottom:12px;}
  #animeMoreEpisodes{text-align:center;padding:12px 0 4px;}
  .animeEnd{font-size:12px;color:var(--text-dim);padding:10px;}

  /* ---------- SALA DE VÍDEO (CALL) ---------- */
  #callView{
    height:100%;display:none;flex-direction:column;background:var(--bg);
  }
  #callHeader{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:var(--bg);
    border-radius:0 0 18px 18px;
  }
  #callHeader .name{font-weight:700;font-size:16px;color:var(--text-bright);flex:1;}
  #callAdminTag{font-size:12px;color:var(--text-dim);}
  #playerWrap{
    position:relative;background:#000;margin:10px 16px 0;border-radius:14px;
    overflow:hidden;flex-shrink:0;aspect-ratio:16/9;
  }
  #sharedPlayer{width:100%;height:100%;display:block;background:#000;}
  #playerOverlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:13px;text-align:center;padding:16px;background:rgba(0,0,0,.3);
  }
  #adminControls{
    display:none;align-items:center;gap:8px;padding:8px 16px;flex-shrink:0;
  }
  #adminControls select{
    flex:1;padding:8px 10px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-input);color:var(--text-bright);font-size:13px;outline:none;
  }
  #adminControls button{
    background:var(--bg-input);border:none;color:var(--text-bright);
    width:34px;height:34px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  #seekBar{flex:1;max-width:110px;}
  #participantsGrid{
    flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);
    gap:8px;padding:10px 16px;align-content:start;
  }
  .callTile{
    position:relative;background:var(--bg-sidebar);border-radius:14px;overflow:hidden;
    aspect-ratio:4/3;
  }
  .callTile video{width:100%;height:100%;object-fit:cover;display:block;}
  .callTileName{
    position:absolute;left:8px;bottom:6px;font-size:11.5px;color:#fff;
    background:rgba(0,0,0,.5);padding:2px 8px;border-radius:10px;
  }
  #callControls{
    display:flex;align-items:center;justify-content:center;gap:14px;
    padding:12px 16px 18px;flex-shrink:0;
  }
  #callControls button{
    width:48px;height:48px;border-radius:50%;border:none;background:var(--bg-input);
    color:var(--text-bright);font-size:19px;cursor:pointer;
  }
  #hangupBtn{background:var(--danger)!important;color:#fff;}

  /* ---------- FIGURINHAS ---------- */
  #stickerBtn{
    background:none;border:none;color:var(--text-dim);
    width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;
  }
  #stickerBtn:active{background:var(--bg-input);}
  .msg .content.stickerContent{background:none;}
  .msg img.stickerImg{
    max-width:150px;max-height:150px;border-radius:0;margin-top:2px;background:none;
  }
  #stickerPanel{
    position:fixed;inset:0;display:none;flex-direction:column;justify-content:flex-end;
    background:rgba(0,0,0,.45);z-index:50;
  }
  #stickerSheet{
    background:var(--bg-sidebar);border-radius:18px 18px 0 0;
    max-height:66vh;display:flex;flex-direction:column;overflow:hidden;
  }
  #stickerSheetHeader{
    display:flex;align-items:center;gap:8px;padding:12px 14px;
    border-bottom:1px solid var(--border);flex-shrink:0;
  }
  #stickerSheetHeader b{color:var(--text-bright);font-size:14px;flex:1;}
  #stickerSheetHeader button{
    background:var(--bg-input);border:none;color:var(--text-dim);
    width:30px;height:30px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  #stickerSheetHeader button.active{background:var(--blurple);color:#fff;}
  #packTabs{
    display:flex;gap:8px;padding:10px 12px;overflow-x:auto;flex-shrink:0;
    border-bottom:1px solid var(--border);
  }
  .packTab{
    flex-shrink:0;padding:8px 14px;border-radius:14px;background:var(--bg-input);
    color:var(--text-dim);font-size:13px;font-weight:600;cursor:pointer;white-space:nowrap;
  }
  .packTab.selected{background:var(--blurple);color:#fff;}
  .packTab.addPack{color:var(--blurple);}
  #stickerGrid{
    flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(3,1fr);
    gap:10px;padding:14px;align-content:start;
  }
  .stickerTile{
    position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;
    background:var(--bg-input);display:flex;align-items:center;justify-content:center;cursor:pointer;
  }
  .stickerTile img{width:100%;height:100%;object-fit:contain;display:block;}
  .stickerTile.addSticker{
    border:2px dashed var(--border);color:var(--text-dim);font-size:30px;background:none;
  }
  .stickerTile .stickerDelete{
    position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;
    background:var(--danger);color:#fff;font-size:12px;border:none;display:none;
    align-items:center;justify-content:center;
  }
  #stickerSheet.manage .stickerTile .stickerDelete{display:flex;}
  #stickerEmptyHint{
    grid-column:1/-1;text-align:center;color:var(--text-dim);font-size:13px;padding:20px 10px;
  }
</style>
</head>
<body>
<div id="app">

  <!-- LOGIN -->
  <div id="login">
    <h1>Đ.M</h1>
    <p class="sub">rede privada do clã</p>
    <input id="loginUser" type="text" placeholder="Usuário" autocomplete="off">
    <input id="loginPass" type="password" placeholder="Senha">
    <button onclick="doLogin()">Entrar</button>
    <div id="loginError"></div>
  </div>

  <!-- LISTA -->
  <div id="listView" style="display:none;">
    <div id="listHeader">
      <div class="myProfile" onclick="document.getElementById('avatarInput').click()">
        <div id="myAvatar"></div>
        <h2>Đ.M</h2>
      </div>
      <button id="notifyBtn" onclick="enableNotifications()" style="display:none;">🔔 Ativar notificações</button>
      <button id="installBtn" onclick="installApp()" style="display:none;">📲 Instalar app</button>
      <button id="logoutBtn" onclick="doLogout()">sair</button>
    </div>
    <input type="file" id="avatarInput" accept="image/*" style="display:none" onchange="handleAvatarUpload(event)">
    <div id="chatList"></div>
  </div>

  <!-- SALA DE VÍDEO -->
  <div id="callView">
    <div id="callHeader">
      <button id="callBackBtn" onclick="leaveCallRoom()">‹</button>
      <div class="name">📹 Sala de Vídeo</div>
      <div id="callAdminTag"></div>
    </div>

    <div id="playerWrap">
      <video id="sharedPlayer" playsinline></video>
      <div id="playerOverlay">Aguardando o admin escolher um vídeo…</div>
    </div>

    <div id="adminControls">
      <select id="videoSelect" onchange="adminSelectVideo()"></select>
      <button id="playPauseBtn" onclick="adminTogglePlay()">▶</button>
      <input type="range" id="seekBar" min="0" max="100" value="0" onchange="adminSeek()">
    </div>

    <div id="participantsGrid"></div>

    <div id="callControls">
      <button id="micBtn" title="Mutar microfone" onclick="toggleMic()">🎤</button>
      <button id="deafenBtn" title="Mutar áudio dos outros" onclick="toggleDeafen()">🔊</button>
      <button id="addVideoBtn" title="Adicionar vídeo" onclick="promptAddVideo()">🎬+</button>
      <button id="animeBtn" title="Abrir central de anime" onclick="openAnimePanel()">🍥</button>
      <button id="hangupBtn" title="Sair da sala" onclick="leaveCallRoom()">📞</button>
    </div>
  </div>


  <!-- CENTRAL DE ANIME / TESTE DE IFRAME -->
  <div id="animeModal" onclick="if(event.target===this) closeAnimePanel()">
    <div id="animePanel">
      <div id="animeHeader">
        <div class="name" id="animeHeaderTitle">🍥 Anime</div>

          <div>O AnimeQ pode impedir que esta página seja exibida dentro de um iframe.<br>
            Se isso acontecer, use o botão abaixo para abrir o episódio diretamente.<br>
            <button onclick="openCurrentAnimeDirect()">Abrir episódio no SupaPlay</button>

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let currentUser = null;
let currentChat = null;      // "general" ou id do chat privado
let currentChatLabel = "";
let currentListener = null;
let profilePhotos = {};      // { usuario: url }
let statusData = {};         // { usuario: {state, last_changed} }
let messagesCache = {};      // { key: dadosDaMensagem } - conversa aberta no momento
let replyingTo = null;       // { id, from, preview } ou null

/* ---------------- PRESENÇA (online/offline) ---------------- */
function setupPresence(){
  const myStatusRef = db.ref("status/" + currentUser);
  db.ref(".info/connected").on("value", snap => {
    if (snap.val() === false) return;
    myStatusRef.onDisconnect().set({
      state: "offline",
      last_changed: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      myStatusRef.set({
        state: "online",
        last_changed: firebase.database.ServerValue.TIMESTAMP
      });
    });
  });

  db.ref("status").on("value", snap => {
    statusData = snap.val() || {};
    refreshAllAvatars();
  });

  db.ref("profiles").on("value", snap => {
    const data = snap.val() || {};
    profilePhotos = {};
    Object.keys(data).forEach(u => {
      if (data[u] && data[u].photoURL) profilePhotos[u] = data[u].photoURL;
    });
    refreshAllAvatars();
  });
}

// Atualiza só o CONTEÚDO dos avatares já existentes na tela (sem recriar
// as mensagens inteiras), pra não reiniciar vídeos/áudios em reprodução.
function refreshAllAvatars(){
  document.querySelectorAll(".avatar[data-user]").forEach(el => {
    const name = el.getAttribute("data-user");
    el.innerHTML = avatarInnerHtml(name);
    if (profilePhotos[name]) {
      el.style.background = "";
    } else {
      el.style.background = avatarColor(name);
    }
  });
  const my = document.getElementById("myAvatar");
  if (my) {
    my.className = "avatar";
    my.setAttribute("data-user", currentUser);
    my.innerHTML = avatarInnerHtml(currentUser);
    my.style.background = profilePhotos[currentUser] ? "" : avatarColor(currentUser);
  }
}

function isOnline(name){
  return !!(statusData[name] && statusData[name].state === "online");
}

function avatarInnerHtml(name){
  const photo = profilePhotos[name];
  const inner = photo ? `<img src="${photo}">` : name.charAt(0).toUpperCase();
  const dot = USERS[name] !== undefined
    ? `<span class="statusDot ${isOnline(name) ? "online" : ""}"></span>`
    : "";
  return inner + dot;
}

function avatarMarkup(name, extraStyle){
  const photo = profilePhotos[name];
  const bg = photo ? "" : ("background:" + avatarColor(name) + ";");
  return `<div class="avatar" data-user="${escapeHtml(name)}" style="${bg}${extraStyle||""}">${avatarInnerHtml(name)}</div>`;
}

/* ---------------- LOGIN ---------------- */
/* ---------------- PONTE COM APP NATIVO (Kodular) ----------------
   Se este site estiver rodando dentro de um WebViewer do Kodular,
   avisa o app nativo de quem logou, pra ele poder salvar o token
   de notificação nativa (FCM) no usuário certo. Não faz nada quando
   aberto num navegador normal (window.AppInventor não existe). */
function notifyNativeApp(username){
  try {
    if (window.AppInventor && window.AppInventor.setWebViewString) {
      window.AppInventor.setWebViewString(username);
    }
  } catch(e){}
}

window.onload = () => {
  const saved = localStorage.getItem("dm_user");
  if (saved && USERS[saved] !== undefined) {
    currentUser = saved;
    showList();
    setupPresence();
    setupNotifications();
    notifyNativeApp(currentUser);
  }
};

function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  if (USERS[u] !== undefined && USERS[u] === p){
    currentUser = u;
    localStorage.setItem("dm_user", u);
    err.textContent = "";
    showList();
    setupPresence();
    setupNotifications();
    notifyNativeApp(currentUser);
  } else {
    err.textContent = "Usuário ou senha incorretos.";
  }
}

/* ---------------- NOTIFICAÇÕES PUSH ---------------- */
let fcmToken = null;

let swRegistration = null;

function setupNotifications(){
  if (!("serviceWorker" in navigator) || !("Notification" in window) || !firebase.messaging) {
    return; // navegador não suporta (comum em Safari fora do modo "Adicionar à Tela de Início")
  }
  if (!VAPID_KEY || VAPID_KEY === "COLE_AQUI_SUA_CHAVE_VAPID") {
    console.warn("Configure VAPID_KEY para ativar notificações push.");
    return;
  }

  navigator.serviceWorker.register("firebase-messaging-sw.js").then(registration => {
    swRegistration = registration;
    const messaging = firebase.messaging();

    // Mensagem chegou com o app aberto (primeiro plano): não mostra notificação
    // do sistema (senão duplicaria), só toca um som se não for a conversa aberta.
    messaging.onMessage(payload => {
      const chat = payload.data && payload.data.chat;
      if (chat && chat === currentChat) return;
      playNotificationSound();
    });

    if (Notification.permission === "granted") {
      // já foi liberado antes: pega o token direto, sem popup.
      getFcmToken(registration);
    } else if (Notification.permission === "default") {
      // ainda não foi perguntado: mostra o botão pro usuário tocar
      // (pedir sozinho, sem toque, o navegador ignora o popup).
      const btn = document.getElementById("notifyBtn");
      if (btn) btn.style.display = "inline-block";
    }
  }).catch(err => console.error("Erro ao registrar service worker:", err));
}

// ---------- INSTALAR APP (PWA) ----------
// O navegador dispara esse evento quando o site cumpre os requisitos
// pra virar app (manifest.json + service worker + https). Guardamos
// o evento pra poder mostrar o prompt de instalação quando o usuário
// tocar no botão, em vez de depender só do menu do navegador.
let deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-block";
});

function installApp(){
  const btn = document.getElementById("installBtn");
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    if (btn) btn.style.display = "none";
  });
}

// Já instalado (aberto a partir do ícone na tela inicial): esconde o botão.
window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});

function enableNotifications(){
  if (!swRegistration) return;
  Notification.requestPermission().then(permission => {
    const btn = document.getElementById("notifyBtn");
    if (permission !== "granted") {
      if (permission === "denied" && btn) btn.style.display = "none";
      return;
    }
    if (btn) btn.style.display = "none";
    getFcmToken(swRegistration);
  });
}

function getFcmToken(registration){
  const messaging = firebase.messaging();
  messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration })
    .then(token => {
      if (!token) return;
      fcmToken = token;
      db.ref("tokens/" + currentUser + "/" + token).set(true);
    })
    .catch(err => console.error("Erro ao obter token de notificação:", err));
}

function playNotificationSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

function doLogout(){
  if (fcmToken && currentUser) {
    db.ref("tokens/" + currentUser + "/" + fcmToken).remove();
  }
  localStorage.removeItem("dm_user");
  currentUser = null;
  document.getElementById("login").style.display = "flex";
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "none";
}

/* ---------------- LISTA DE CONVERSAS ---------------- */
function showList(){
  document.getElementById("login").style.display = "none";
  document.getElementById("chatView").style.display = "none";
  document.getElementById("listView").style.display = "flex";

  const list = document.getElementById("chatList");
  list.innerHTML = "";

  list.appendChild(makeChatItem("📹 Sala de Vídeo", "toque para entrar na call", () => openCallRoom()));
  list.appendChild(makeChatItem("Geral", "Chat geral do clã", () => openChat("general", "Geral")));

  Object.keys(USERS).filter(u => u !== currentUser).forEach(u => {
    list.appendChild(makeChatItem(u, "toque para conversar", () => {
      const chatId = [currentUser, u].sort().join("_");
      openChat(chatId, u);
    }));
  });
}

function makeChatItem(name, preview, onClick){
  const div = document.createElement("div");
  div.className = "chatItem";
  div.onclick = onClick;
  div.innerHTML = `
    ${avatarMarkup(name)}
    <div class="info">
      <div class="name">${escapeHtml(name)}</div>
      <div class="preview">${escapeHtml(preview)}</div>
    </div>`;
  return div;
}

/* ---------------- CHAT ---------------- */
function openChat(chatId, label){
  currentChat = chatId;
  currentChatLabel = label;
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "flex";
  const titleEl = document.getElementById("chatTitle");
  titleEl.textContent = label;
  titleEl.classList.toggle("channel", chatId === "general");
  document.getElementById("messages").innerHTML = "";
  messagesCache = {};
  cancelReply();

  const headerAvatar = document.getElementById("chatHeaderAvatar");
  headerAvatar.innerHTML = chatId === "general" ? "" : avatarMarkup(label);
  headerAvatar.style.display = chatId === "general" ? "none" : "block";

  const path = chatId === "general" ? "messages/general" : "messages/private/" + chatId;
  if (currentListener) currentListener.off();
  const ref = db.ref(path).limitToLast(200);
  ref.on("child_added", snap => {
    const box = document.getElementById("messages");
    messagesCache[snap.key] = snap.val();
    box.appendChild(buildMessageEl(snap.key, snap.val()));
    box.scrollTop = box.scrollHeight;
  });
  ref.on("child_changed", snap => {
    messagesCache[snap.key] = snap.val();
    const old = document.querySelector('.msg[data-key="' + snap.key + '"]');
    if (old) old.replaceWith(buildMessageEl(snap.key, snap.val()));
  });
  ref.on("child_removed", snap => {
    delete messagesCache[snap.key];
    const old = document.querySelector('.msg[data-key="' + snap.key + '"]');
    if (old) old.remove();
  });
  currentListener = ref;
}

function closeChat(){
  if (currentListener) currentListener.off();
  currentChat = null;
  cancelReply();
  showList();
}

function previewFor(m){
  if (m.type === "text") return m.text.length > 60 ? m.text.slice(0,60) + "…" : m.text;
  if (m.type === "image") return "📷 imagem";
  if (m.type === "video") return "🎥 vídeo";
  if (m.type === "audio") return "🎤 áudio";
  if (m.type === "file") return "📎 " + (m.fileName || "arquivo");
  if (m.type === "sticker") return "🏷️ figurinha";
  return "";
}

function buildMessageEl(key, m){
  const div = document.createElement("div");
  const mine = m.from === currentUser;
  div.className = "msg " + (mine ? "me" : "other");
  div.dataset.key = key;

  let content = "";
  if (m.type === "text") {
    content = escapeHtml(m.text);
  } else if (m.type === "image") {
    content = `<img src="${m.url}">`;
  } else if (m.type === "video") {
    content = `<video src="${m.url}" controls></video>`;
  } else if (m.type === "audio") {
    content = `<audio src="${m.url}" controls></audio>`;
  } else if (m.type === "file") {
    content = `<a class="fileLink" href="${m.url}" target="_blank">📎 ${escapeHtml(m.fileName || "arquivo")}</a>`;
    if (m.renamed) {
      content += `<div class="renameNote">⚠️ depois de baixar, apague o ".zip" do final do nome do arquivo</div>`;
    }
  } else if (m.type === "sticker") {
    content = `<img class="stickerImg" src="${m.url}">`;
  }
  const t = new Date(m.timestamp);
  const time = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  const editedTag = m.edited ? `<span class="editedTag">(editado)</span>` : "";

  let quoteHtml = "";
  if (m.replyTo) {
    quoteHtml = `<div class="quote" onclick="scrollToMessage('${m.replyTo.id}')"><b>${escapeHtml(m.replyTo.from)}</b>${escapeHtml(m.replyTo.preview)}</div>`;
  }

  const actionsHtml = `
    <div class="actions">
      <button title="Responder" onclick="startReply('${key}')">↩</button>
      ${mine && m.type === "text" ? `<button title="Editar" onclick="startEdit('${key}')">✎</button>` : ""}
      ${mine ? `<button title="Excluir" onclick="deleteMsg('${key}')">🗑</button>` : ""}
    </div>`;

  div.innerHTML = `
    ${avatarMarkup(m.from)}
    <div class="body">
      <div class="head">
        <span class="sender">${escapeHtml(m.from)}</span>
        <span class="time">${time}</span>
        ${editedTag}
      </div>
      ${quoteHtml}
      <div class="content${m.type === "sticker" ? " stickerContent" : ""}">${content}</div>
    </div>
    ${actionsHtml}`;
  return div;
}

function scrollToMessage(key){
  const el = document.querySelector('.msg[data-key="' + key + '"]');
  if (!el) return;
  el.scrollIntoView({ behavior:"smooth", block:"center" });
  el.classList.add("highlight");
  setTimeout(() => el.classList.remove("highlight"), 1200);
}

/* ---------------- RESPONDER / EDITAR / EXCLUIR ---------------- */
function startReply(key){
  const m = messagesCache[key];
  if (!m) return;
  replyingTo = { id: key, from: m.from, preview: previewFor(m) };
  const bar = document.getElementById("replyBar");
  bar.style.display = "flex";
  document.getElementById("replyBarText").innerHTML =
    `Respondendo <b>${escapeHtml(replyingTo.from)}</b>: ${escapeHtml(replyingTo.preview)}`;
  document.getElementById("textInput").focus();
}

function cancelReply(){
  replyingTo = null;
  const bar = document.getElementById("replyBar");
  if (bar) bar.style.display = "none";
}

function startEdit(key){
  const m = messagesCache[key];
  if (!m || m.type !== "text") return;
  const novo = prompt("Editar mensagem:", m.text);
  if (novo === null) return;
  const trimmed = novo.trim();
  if (!trimmed) return;
  const path = currentChat === "general" ? "messages/general" : "messages/private/" + currentChat;
  db.ref(path + "/" + key).update({ text: trimmed, edited: true });
}

function deleteMsg(key){
  if (!confirm("Excluir esta mensagem?")) return;
  const path = currentChat === "general" ? "messages/general" : "messages/private/" + currentChat;
  db.ref(path + "/" + key).remove();
}

function avatarColor(name){
  const palette = ["#5865f2","#eb459e","#57f287","#fee75c","#ed4245","#00a8fc","#f47b67"];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return palette[Math.abs(hash) % palette.length];
}

function sendText(){
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  const data = { type:"text", text: text };
  if (replyingTo) data.replyTo = replyingTo;
  pushMessage(data);
  input.value = "";
  cancelReply();
}

function pushMessage(data){
  const path = currentChat === "general" ? "messages/general" : "messages/private/" + currentChat;
  db.ref(path).push({
    from: currentUser,
    timestamp: Date.now(),
    ...data
  });
}

const BLOCKED_EXT = ["exe","apk","bat","cmd","com","cpl","csh","dll","msc","msi","msp",
  "pif","ps1","scr","sh","vb","vbs","vbe","ws","wsf","wsc","wsh","jar"];

function isBlockedExt(name){
  const ext = name.split(".").pop().toLowerCase();
  return BLOCKED_EXT.includes(ext);
}

/* ---------------- ENVIO DE ARQUIVOS ---------------- */
function handleFile(event){
  const file = event.target.files[0];
  if (!file) return;

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "audio";

  // O Cloudinary bloqueia certas extensões (apk, exe, etc.) por segurança.
  // Contorno: renomeia escondendo a extensão antes de enviar; quem recebe
  // precisa apagar o ".zip" do final do nome depois de baixar.
  const blocked = type === "file" && isBlockedExt(file.name);
  const uploadTarget = blocked ? new File([file], file.name + ".zip", { type: file.type }) : file;

  const status = document.getElementById("uploadStatus");
  status.style.display = "block";
  status.textContent = "enviando... 0%";

  const formData = new FormData();
  formData.append("file", uploadTarget);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      status.textContent = "enviando... " + pct + "%";
    }
  };

  xhr.onload = () => {
    status.style.display = "none";
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      pushMessage({ type: type, url: res.secure_url, fileName: file.name, renamed: blocked });
    } else {
      let detail = xhr.responseText;
      try { detail = JSON.parse(xhr.responseText).error.message; } catch(e){}
      alert("Falha ao enviar arquivo (" + xhr.status + "): " + detail);
    }
  };

  xhr.onerror = () => {
    status.style.display = "none";
    alert("Falha de conexão ao enviar o arquivo.");
  };

  xhr.send(formData);
  event.target.value = "";
}

/* ---------------- FOTO DE PERFIL ---------------- */
function handleAvatarUpload(event){
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("Escolha uma imagem para a foto de perfil.");
    event.target.value = "";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("profiles/" + currentUser).update({ photoURL: res.secure_url });
    } else {
      alert("Falha ao enviar foto de perfil.");
    }
  };
  xhr.onerror = () => alert("Falha de conexão ao enviar a foto de perfil.");
  xhr.send(formData);
  event.target.value = "";
}

/* ================= FIGURINHAS =================
   Packs de figurinhas compartilhados com todo mundo do clã, guardados
   no Firebase em stickerPacks/{packId}/stickers/{stickerId}. Qualquer
   um pode criar um pack novo e adicionar figurinhas nele. "Criar
   figurinha" pega qualquer imagem, encaixa ela num quadrado 512x512
   (com fundo transparente, tipo as figurinhas do WhatsApp) e sobe pro
   Cloudinary antes de salvar a referência no pack escolhido. */
let stickerPacksCache = {};
let selectedPackId = null;
let stickerManageMode = false;
let stickerListenerAttached = false;
let pendingStickerPack = null;

function openStickerPanel(){
  document.getElementById("stickerPanel").style.display = "flex";
  if (!stickerListenerAttached){
    stickerListenerAttached = true;
    db.ref("stickerPacks").on("value", snap => {
      stickerPacksCache = snap.val() || {};
      if (!selectedPackId || !stickerPacksCache[selectedPackId]){
        selectedPackId = Object.keys(stickerPacksCache)[0] || null;
      }
      renderPackTabs();
      renderStickerGrid();
    });
  }
}

function closeStickerPanel(){
  document.getElementById("stickerPanel").style.display = "none";
  stickerManageMode = false;
  document.getElementById("stickerSheet").classList.remove("manage");
  document.getElementById("manageBtn").classList.remove("active");
}

function toggleManageMode(){
  stickerManageMode = !stickerManageMode;
  document.getElementById("stickerSheet").classList.toggle("manage", stickerManageMode);
  document.getElementById("manageBtn").classList.toggle("active", stickerManageMode);
  renderPackTabs();
}

function renderPackTabs(){
  const wrap = document.getElementById("packTabs");
  const packIds = Object.keys(stickerPacksCache);
  wrap.innerHTML = packIds.map(id => {
    const p = stickerPacksCache[id] || {};
    const sel = id === selectedPackId ? " selected" : "";
    const delBtn = stickerManageMode
      ? ` <span onclick="event.stopPropagation();deletePack('${id}')">✕</span>` : "";
    return `<div class="packTab${sel}" onclick="selectPack('${id}')">${escapeHtml(p.name || "Pack")}${delBtn}</div>`;
  }).join("") + `<div class="packTab addPack" onclick="createPack()">+ novo pack</div>`;
}

function selectPack(id){

function createPack(){

function deletePack(id){

function renderStickerGrid(){

  let html = ids.length ? "" : `<div id="stickerEmptyHint">Esse pack ainda não tem figurinhas. Toque no + pra criar a primeira.</div>`;
  html += ids.map(sid => `

function deleteSticker(packId, stickerId){

}

function sendSticker(url){

}

/* ---- criar figurinha a partir de qualquer imagem ---- */
function triggerAddSticker(packId){
  pendingStickerPack = packId;
  document.getElementById("stickerFileInput").click();
}

function handleStickerUpload(event){
  const file = event.target.files[0];
  event.target.value = "";
  if (!file || !pendingStickerPack) return;
  if (!file.type.startsWith("image/")) {
    alert("Escolha uma imagem pra virar figurinha.");
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // encaixa a imagem inteira num quadrado 512x512 com fundo
      // transparente, do jeito que as figurinhas costumam vir.
      const SIZE = 512;
      const canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext("2d");
      const scale = Math.min(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      canvas.toBlob(blob => uploadSticker(blob), "image/png");
    };
    img.onerror = () => alert("Não foi possível ler essa imagem.");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function uploadSticker(blob){
  const packId = pendingStickerPack;
  const headerTitle = document.querySelector("#stickerSheetHeader b");
  const original = headerTitle.textContent;
  headerTitle.textContent = "Criando figurinha...";

  const formData = new FormData();
  formData.append("file", blob, "sticker.png");
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");
  xhr.onload = () => {
    headerTitle.textContent = original;
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("stickerPacks/" + packId + "/stickers").push({ url: res.secure_url, addedBy: currentUser });
    } else {
      alert("Falha ao criar a figurinha.");
    }
  };
  xhr.onerror = () => { headerTitle.textContent = original; alert("Falha de conexão ao criar a figurinha."); };
  xhr.send(formData);
}

/* ================= SALA DE VÍDEO (CALL) =================
   Chamada em grupo via WebRTC (mesh: todo mundo conecta com todo
   mundo direto), usando o próprio Firebase como "sinalizador" pra
   trocar as informações de conexão. Não usa servidor nenhum além
   do que vocês já têm. Funciona bem pra grupos pequenos (tipo o
   clã de vocês). Sem servidor TURN: em redes com NAT/firewall bem
   restritivo (ex: 4G de operadora, wifi corporativo) a conexão
   direta pode falhar — em wifi doméstico normal funciona certo.

   Adicionar vídeo: qualquer um na sala pode tocar no botão 🎬+ e
   colar um link direto de arquivo de vídeo (o mesmo tipo de link
   que o Cloudinary gera quando alguém manda um vídeo no chat — pode
   subir os vídeos lá e colar o link). É pedida a senha "1998" antes
   de adicionar. O vídeo entra pra lista de todo mundo, e só o admin
   da sala (quem entrou primeiro) escolhe qual tocar. */
let videoLibrary = {}; // { id: { title, url, addedBy } }, carregada de videoLibrary no Firebase

const ICE_SERVERS = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

let callPeers = {};         // { usuario: RTCPeerConnection }
let localStream = null;
let callParticipants = {};  // snapshot atual de callRoom/participants
let callAmIAdmin = false;
let isMicMuted = false;
let isDeafened = false;
let playerSyncTimer = null;

function openCallRoom(){
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "none";
  document.getElementById("callView").style.display = "flex";

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      localStream = stream;
      renderParticipantTile(currentUser, stream, true);
      joinCallSignaling();
    })
    .catch(() => {
      // sem microfone (ou usuário negou o acesso): entra mesmo assim,
      // só que sem poder falar. Continua ouvindo e vendo os vídeos
      // compartilhados normalmente, como ouvinte.
      localStream = null;
      isMicMuted = true;
      document.getElementById("micBtn").textContent = "🔇";
      renderParticipantTile(currentUser, null, true);
      joinCallSignaling();
    });
}

function joinCallSignaling(){
  const myRef = db.ref("callRoom/participants/" + currentUser);
  myRef.onDisconnect().remove();
  myRef.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP });

  db.ref("callRoom/participants").on("value", snap => {
    callParticipants = snap.val() || {};
    updateAdminStatus();
    syncPeerConnections();
    removeStaleTiles();
  });

  db.ref("videoLibrary").on("value", snap => {
    videoLibrary = snap.val() || {};
    if (callAmIAdmin) populateVideoSelect();
  });

  listenForSignals();
  listenForPlayerState();
}

/* ---- admin = quem entrou primeiro na sala (menor joinedAt) ---- */
function updateAdminStatus(){
  const entries = Object.entries(callParticipants);
  entries.sort((a, b) => (a[1].joinedAt || 0) - (b[1].joinedAt || 0));
  const adminUser = entries.length ? entries[0][0] : null;
  callAmIAdmin = adminUser === currentUser;
  document.getElementById("adminControls").style.display = callAmIAdmin ? "flex" : "none";
  document.getElementById("callAdminTag").textContent = adminUser ? ("admin: " + adminUser) : "";
  if (callAmIAdmin) populateVideoSelect();
}

/* ---- conexões WebRTC (mesh) ---- */
function syncPeerConnections(){
  const others = Object.keys(callParticipants).filter(u => u !== currentUser);
  others.forEach(u => { if (!callPeers[u]) createPeerConnection(u); });
  Object.keys(callPeers).forEach(u => {
    if (!others.includes(u)) closePeerConnection(u);
  });
}

function createPeerConnection(peerUser){
  const pc = new RTCPeerConnection(ICE_SERVERS);
  callPeers[peerUser] = pc;

  pc.ontrack = (event) => renderParticipantTile(peerUser, event.streams[0], false);

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      db.ref("callRoom/signals/" + peerUser + "/" + currentUser + "/candidates").push(event.candidate.toJSON());
    }
  };

  // Só um dos dois lados manda a "oferta" de conexão, senão os dois
  // tentam ao mesmo tempo e a conexão nunca fecha. Decide por ordem
  // alfabética do nome de usuário.
  if (currentUser < peerUser) {
    pc.onnegotiationneeded = async () => {
      try {
        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
        db.ref("callRoom/signals/" + peerUser + "/" + currentUser + "/offer").set({ sdp: offer.sdp, type: offer.type });
      } catch(e){ console.error(e); }
    };
  }

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  }
}

function closePeerConnection(peerUser){
  if (callPeers[peerUser]) { callPeers[peerUser].close(); delete callPeers[peerUser]; }
  const tile = document.getElementById("tile-" + peerUser);
  if (tile) tile.remove();
  db.ref("callRoom/signals/" + currentUser + "/" + peerUser).off();
  db.ref("callRoom/signals/" + currentUser + "/" + peerUser).remove();
}

function listenForSignals(){
  db.ref("callRoom/signals/" + currentUser).on("child_added", (fromSnap) => {
    const peerUser = fromSnap.key;

    fromSnap.ref.child("offer").on("value", async (offerSnap) => {
      const offer = offerSnap.val();
      if (!offer) return;
      let pc = callPeers[peerUser];
      if (!pc) { createPeerConnection(peerUser); pc = callPeers[peerUser]; }
      if (pc.signalingState !== "stable") return;
      await pc.setRemoteDescription(new RTCSessionDescription(offer));
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      db.ref("callRoom/signals/" + peerUser + "/" + currentUser + "/answer").set({ sdp: answer.sdp, type: answer.type });
    });

    fromSnap.ref.child("answer").on("value", async (answerSnap) => {
      const answer = answerSnap.val();
      const pc = callPeers[peerUser];
      if (!answer || !pc || pc.signalingState === "stable") return;
      await pc.setRemoteDescription(new RTCSessionDescription(answer));
    });

    fromSnap.ref.child("candidates").on("child_added", (candSnap) => {
      const pc = callPeers[peerUser];
      if (pc) pc.addIceCandidate(new RTCIceCandidate(candSnap.val())).catch(() => {});
    });
  });
}

function renderParticipantTile(user, stream, isMe){
  let tile = document.getElementById("tile-" + user);
  if (!tile) {
    tile = document.createElement("div");
    tile.className = "callTile";
    tile.id = "tile-" + user;
    tile.innerHTML = `<video autoplay playsinline ${isMe ? "muted" : ""}></video><span class="callTileName">${escapeHtml(user)}${isMe ? " (você)" : ""}</span>`;
    document.getElementById("participantsGrid").appendChild(tile);
  }
  tile.querySelector("video").srcObject = stream;
}

function removeStaleTiles(){
  document.querySelectorAll(".callTile").forEach(tile => {
    const user = tile.id.replace("tile-", "");
    if (user !== currentUser && !callParticipants[user]) tile.remove();
  });
}

/* ---- controles de mic / áudio dos outros / câmera ---- */
function toggleMic(){
  if (!localStream) return;
  isMicMuted = !isMicMuted;
  localStream.getAudioTracks().forEach(t => t.enabled = !isMicMuted);
  document.getElementById("micBtn").textContent = isMicMuted ? "🔇" : "🎤";
}

function toggleDeafen(){
  isDeafened = !isDeafened;
  document.querySelectorAll(".callTile").forEach(tile => {
    if (tile.id !== "tile-" + currentUser) tile.querySelector("video").muted = isDeafened;
  });
  document.getElementById("deafenBtn").textContent = isDeafened ? "🔇" : "🔊";
}

function leaveCallRoom(){
  Object.keys(callPeers).forEach(closePeerConnection);
  if (localStream) { localStream.getTracks().forEach(t => t.stop()); localStream = null; }
  db.ref("callRoom/participants/" + currentUser).remove();
  db.ref("callRoom/participants").off();
  db.ref("videoLibrary").off();
  db.ref("callRoom/signals/" + currentUser).off();
  db.ref("callRoom/player").off();
  document.getElementById("participantsGrid").innerHTML = "";
  document.getElementById("sharedPlayer").removeAttribute("src");
  document.getElementById("sharedPlayer").dataset.currentId = "";
  document.getElementById("playerOverlay").style.display = "flex";
  isMicMuted = false; isDeafened = false;
  document.getElementById("micBtn").textContent = "🎤";
  document.getElementById("deafenBtn").textContent = "🔊";
  clearInterval(playerSyncTimer);
  document.getElementById("callView").style.display = "none";
  showList();
}

/* ---- player de vídeo sincronizado (só o admin controla) ---- */
function populateVideoSelect(){
  const sel = document.getElementById("videoSelect");
  const ids = Object.keys(videoLibrary);
  sel.innerHTML = `<option value="">Escolher vídeo…</option>` +
    ids.map(id => `<option value="${id}">${escapeHtml(videoLibrary[id].title)}</option>`).join("");
}

function promptAddVideo(){
  const pass = prompt("Senha pra adicionar vídeo:");
  if (pass === null) return;
  if (pass !== "1998") { alert("Senha incorreta."); return; }

  const title = prompt("Nome do vídeo (vai aparecer na lista):");
  if (title === null) return;
  const trimmedTitle = title.trim();
  if (!trimmedTitle) return;

  const url = prompt("Link direto do arquivo de vídeo (ex: link do Cloudinary):");
  if (url === null) return;
  const trimmedUrl = url.trim();
  if (!trimmedUrl) return;

  db.ref("videoLibrary").push({ title: trimmedTitle, url: trimmedUrl, addedBy: currentUser });
  alert("Vídeo adicionado! O admin da sala já consegue escolher ele na lista.");
}

function adminSelectVideo(){
  const id = document.getElementById("videoSelect").value;
  const video = videoLibrary[id];
  if (!video) return;
  db.ref("callRoom/player").set({
    videoId: id,
    playing: false,
    time: 0,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function adminTogglePlay(){
  const player = document.getElementById("sharedPlayer");
  db.ref("callRoom/player").once("value", snap => {
    const state = snap.val();
    if (!state) return;
    db.ref("callRoom/player").update({
      playing: !state.playing,
      time: player.currentTime,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  });
}

function adminSeek(){
  const bar = document.getElementById("seekBar");
  const player = document.getElementById("sharedPlayer");
  const newTime = (bar.value / 100) * (player.duration || 0);
  db.ref("callRoom/player").update({
    time: newTime,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function listenForPlayerState(){
  db.ref("callRoom/player").on("value", snap => {
    const state = snap.val();
    const player = document.getElementById("sharedPlayer");
    const overlay = document.getElementById("playerOverlay");
    if (!state || !state.videoId) {
      overlay.style.display = "flex";
      return;
    }
    const video = videoLibrary[state.videoId];
    if (!video) return;
    overlay.style.display = "none";
    if (player.dataset.currentId !== state.videoId) {
      player.dataset.currentId = state.videoId;
      player.src = video.url;
    }
    const drift = state.playing ? (Date.now() - (state.updatedAt || Date.now())) / 1000 : 0;
    const expected = (state.time || 0) + Math.max(drift, 0);
    if (Math.abs(player.currentTime - expected) > 1.2) player.currentTime = expected;
    if (state.playing && player.paused) player.play().catch(() => {});
    if (!state.playing && !player.paused) player.pause();
    document.getElementById("playPauseBtn").textContent = state.playing ? "⏸" : "▶";
  });

  // a cada 5s o admin reenvia a posição atual, pra corrigir qualquer
  // desalinhamento de quem entrou depois ou teve uma conexão mais lenta
  playerSyncTimer = setInterval(() => {
    if (!callAmIAdmin) return;
    const player = document.getElementById("sharedPlayer");
    if (player.paused || !player.dataset.currentId) return;
    db.ref("callRoom/player").update({ time: player.currentTime, updatedAt: firebase.database.ServerValue.TIMESTAMP });
  }, 5000);

  document.getElementById("sharedPlayer").addEventListener("timeupdate", () => {
    if (!callAmIAdmin) return;
    const player = document.getElementById("sharedPlayer");
    const bar = document.getElementById("seekBar");
    if (player.duration) bar.value = (player.currentTime / player.duration) * 100;
  });
}


/* ---------------- CENTRAL DE ANIME / YANIME ---------------- */
const SUPAPLAY_EMBED_BASE = "https://supaplay.fun/stream/ani";
const ANILIST_API = "https://graphql.anilist.co";
const JIKAN_API = "https://api.jikan.moe/v4/anime";
let currentAnimeEpisodeUrl = "";
let currentAnime = null;
let animeSearchTimer = null;

function openAnimePanel(){
  const modal = document.getElementById("animeModal");
  if (!modal) return;
  modal.style.display = "flex";
  document.getElementById("animeSearch").value = "";
  currentAnime = null;
  closeAnimeFrame();
  showAnimeSearchState("Digite o nome de um anime para pesquisar.");
  setTimeout(() => document.getElementById("animeSearch")?.focus(), 40);
}

function closeAnimePanel(){
  closeAnimeFrame();
  const modal = document.getElementById("animeModal");
  if (modal) modal.style.display = "none";
  currentAnime = null;
}

function showAnimeSearchState(text){
  const root = document.getElementById("animeResults");
  if (!root) return;
  root.style.display = "block";
  root.innerHTML = `<div class="animeEmpty">${escapeHtml(text)}</div>`;
}

function filterAnimeCatalog(){
  clearTimeout(animeSearchTimer);
  const input = document.getElementById("animeSearch");
  const q = input ? input.value.trim() : "";
  if (!q){ showAnimeSearchState("Digite o nome de um anime para pesquisar."); return; }
  if (q.length < 2){ showAnimeSearchState("Digite pelo menos 2 caracteres."); return; }
  animeSearchTimer = setTimeout(() => searchAnime(q), 450);
}

async function searchAnime(query){
  showAnimeSearchState("🔎 Pesquisando...");
  let errors = [];

  // 1) Jikan/MAL: GET simples, ótimo para GitHub Pages.
  try {
    const url = `${JIKAN_API}?q=${encodeURIComponent(query)}&limit=12&sfw=true`;
    const res = await fetch(url, { method: "GET", headers: { "Accept": "application/json" } });
    if (res.ok){
      const json = await res.json();
      const list = (json.data || []).map(a => ({
        id: a.mal_id,
        idMal: a.mal_id,
        idAnilist: null,
        title: {
          userPreferred: a.title || a.title_english || a.title_japanese,
          romaji: a.title,
          english: a.title_english,
          native: a.title_japanese
        },
        type: a.type,
        format: a.type,
        status: a.status,
        episodes: a.episodes,
        seasonYear: a.year || (a.aired?.from ? new Date(a.aired.from).getFullYear() : null),
        coverImage: { medium: a.images?.jpg?.image_url, large: a.images?.jpg?.large_image_url }
      })).filter(a => a.idMal);
      if (list.length){ renderAnimeSearchResults(list); return; }
    } else errors.push(`Jikan ${res.status}`);
  } catch(e){ errors.push(`Jikan: ${e.message}`); }

  // 2) AniList: fallback oficial documentado.
  try {
    const gql = `query ($search: String!) {
      Page(page: 1, perPage: 12) {
        media(search: $search, type: ANIME) {
          id idMal
          title { romaji english native userPreferred }
          type format episodes seasonYear
          coverImage { medium large }
        }
      }
    }`;
    const res = await fetch(ANILIST_API, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({ query: gql, variables: { search: query } })
    });
    const json = await res.json();
    if (!res.ok || json.errors?.length) throw new Error(json.errors?.[0]?.message || `HTTP ${res.status}`);
    const list = (json.data?.Page?.media || []).filter(a => a.idMal).map(a => ({...a, idAnilist: a.id}));
    if (list.length){ renderAnimeSearchResults(list); return; }
  } catch(e){ errors.push(`AniList: ${e.message}`); }

  console.error("Pesquisa de anime falhou:", errors);
  showAnimeSearchState("Não encontrei esse anime agora. Tente outro nome.");
}

function getAnimeDisplayTitle(anime){
  return anime.title?.userPreferred || anime.title?.romaji || anime.title?.english || anime.title?.native || "Anime";
}

function renderAnimeSearchResults(list){
  const root = document.getElementById("animeResults");
  if (!root) return;
  root.style.display = "block";
  window._animeSearchResults = list;
  root.innerHTML = list.map((anime, i) => {
    const title = getAnimeDisplayTitle(anime);
    const year = anime.seasonYear || "ano desconhecido";
    const cover = anime.coverImage?.medium || anime.coverImage?.large || "";
    return `<button class="animeSearchResult" onclick="selectAnimeSearchResult(${i})">
      <div class="animePosterWrap">${cover ? `<img src="${escapeHtml(cover)}" alt="" loading="lazy">` : `<div class="animePosterFallback">🍥</div>`}</div>
      <div class="animeSearchInfo">
        <div class="animeTitle">${escapeHtml(title)}</div>
        <div class="animeMeta">${escapeHtml(anime.format || anime.type || "Anime")} · ${year} · MAL #${anime.idMal}</div>
        <div class="animeHint">${anime.episodes ? `${anime.episodes} episódios · ` : ""}Toque para ver</div>
      </div>
    </button>`;
  }).join("");
}

function selectAnimeSearchResult(index){
  const anime = window._animeSearchResults?.[index];
  if (!anime) return;
  currentAnime = anime;
  document.getElementById("animeHeaderTitle").textContent = `🍥 ${getAnimeDisplayTitle(anime)}`;
  document.getElementById("animeSearchWrap").style.display = "none";
  renderAnimeEpisodes(anime);
}

function renderAnimeEpisodes(anime){
  const root = document.getElementById("animeResults");
  const count = Number(anime.episodes || 0);
  const safeCount = Math.min(count, 500);
  root.style.display = "block";
  if (!safeCount){
    root.innerHTML = `<div class="animeBackRow"><button onclick="backToAnimeSearch()">‹ Voltar para a pesquisa</button></div>
      <div class="animeSelectedTitle">${escapeHtml(getAnimeDisplayTitle(anime))}</div>
      <div class="animeMeta animeSelectedMeta">MAL #${anime.idMal}</div>
      <div class="animeEmpty">Esse título não informa uma quantidade fixa de episódios.</div>`;
    return;
  }
  const buttons = Array.from({length: safeCount}, (_, i) => `<button class="animeEp" onclick="openAnimeEpisodeByNumber(${i + 1})">EP ${i + 1}</button>`).join("");
  root.innerHTML = `<div class="animeBackRow"><button onclick="backToAnimeSearch()">‹ Voltar para a pesquisa</button></div>
    <div class="animeSelectedTitle">${escapeHtml(getAnimeDisplayTitle(anime))}</div>
    <div class="animeMeta animeSelectedMeta">MAL #${anime.idMal} · ${escapeHtml(anime.format || anime.type || "Anime")} · ${count} episódios</div>
    <div class="animeEpisodes" id="animeEpisodeGrid">${buttons}</div>
    <div class="animeEnd">Selecione um episódio para abrir o player.</div>`;
}

function openAnimeEpisodeByNumber(episodeNumber){
  if (!currentAnime?.idMal) return;
  // SupaPlay aceita o ID do AniList ou, quando ele não está disponível,
  // o MAL ID no mesmo endpoint /stream/ani/.
  const providerId = currentAnime.idAnilist || currentAnime.idMal;
  const url = `${SUPAPLAY_EMBED_BASE}/${encodeURIComponent(providerId)}/${encodeURIComponent(episodeNumber)}/sub`;
  currentAnimeEpisodeUrl = url;
  document.getElementById("animeHeaderTitle").textContent = `🍥 ${getAnimeDisplayTitle(currentAnime)} · EP ${episodeNumber}`;
  document.getElementById("animeResults").style.display = "none";
  document.getElementById("animeSearchWrap").style.display = "none";
  document.getElementById("animeFrameWrap").style.display = "block";
  document.getElementById("animeFrameFallback").style.display = "none";
  document.getElementById("animeFrame").src = url;
}

function backToAnimeSearch(){
  currentAnime = null;
  closeAnimeFrame();
  document.getElementById("animeHeaderTitle").textContent = "🍥 Anime";
  showAnimeSearchState("Digite o nome de um anime para pesquisar.");
  document.getElementById("animeSearch")?.focus();
}

function closeAnimeFrame(){
  const frame = document.getElementById("animeFrame");
  if (frame) frame.src = "about:blank";
  const wrap = document.getElementById("animeFrameWrap");
  const results = document.getElementById("animeResults");
  const searchWrap = document.getElementById("animeSearchWrap");
  if (wrap) wrap.style.display = "none";
  if (results) results.style.display = "block";
  if (searchWrap) searchWrap.style.display = "block";
  const title = document.getElementById("animeHeaderTitle");
  if (title) title.textContent = "🍥 Anime";
}

function openCurrentAnimeDirect(){
  if (currentAnimeEpisodeUrl) window.open(currentAnimeEpisodeUrl, "_blank", "noopener,noreferrer");
}


/* ---------------- UTIL ---------------- */
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
</script>
