<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let currentUser = null;
let currentChat = null;      // "general" ou id do chat privado
let currentChatLabel = "";
let currentListener = null;
let profilePhotos = {};      // { usuario: url }
let statusData = {};         // { usuario: {state, last_changed} }

/* ---------------- PRESENÇA (online/offline) ---------------- */
function setupPresence(){
  const myStatusRef = db.ref("status/" + currentUser);
  db.ref(".info/connected").on("value", snap => {
    if (snap.val() === false) return;
    myStatusRef.onDisconnect().set({
      state: "offline",
      last_changed: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      myStatusRef.set({
        state: "online",
        last_changed: firebase.database.ServerValue.TIMESTAMP
      });
    });
  });

  db.ref("status").on("value", snap => {
    statusData = snap.val() || {};
    refreshAllAvatars();
  });

  db.ref("profiles").on("value", snap => {
    const data = snap.val() || {};
    profilePhotos = {};
    Object.keys(data).forEach(u => {
      if (data[u] && data[u].photoURL) profilePhotos[u] = data[u].photoURL;
    });
    refreshAllAvatars();
  });
}

// Atualiza só o CONTEÚDO dos avatares já existentes na tela (sem recriar
// as mensagens inteiras), pra não reiniciar vídeos/áudios em reprodução.
function refreshAllAvatars(){
  document.querySelectorAll(".avatar[data-user]").forEach(el => {
    const name = el.getAttribute("data-user");
    el.innerHTML = avatarInnerHtml(name);
    if (profilePhotos[name]) {
      el.style.background = "";
    } else {
      el.style.background = avatarColor(name);
    }
  });
  const my = document.getElementById("myAvatar");
  if (my) {
    my.className = "avatar";
    my.setAttribute("data-user", currentUser);
    my.innerHTML = avatarInnerHtml(currentUser);
    my.style.background = profilePhotos[currentUser] ? "" : avatarColor(currentUser);
  }
}

function isOnline(name){
  return !!(statusData[name] && statusData[name].state === "online");
}

function avatarInnerHtml(name){
  const photo = profilePhotos[name];
  const inner = photo ? `<img src="${photo}">` : name.charAt(0).toUpperCase();
  const dot = USERS[name] !== undefined
    ? `<span class="statusDot ${isOnline(name) ? "online" : ""}"></span>`
    : "";
  return inner + dot;
}

function avatarMarkup(name, extraStyle){
  const photo = profilePhotos[name];
  const bg = photo ? "" : ("background:" + avatarColor(name) + ";");
  return `<div class="avatar" data-user="${escapeHtml(name)}" style="${bg}${extraStyle||""}">${avatarInnerHtml(name)}</div>`;
}

/* ---------------- LOGIN ---------------- */
window.onload = () => {
  const saved = localStorage.getItem("dm_user");
  if (saved && USERS[saved] !== undefined) {
    currentUser = saved;
    showList();
    setupPresence();
    setupNotifications();
  }
};

function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  if (USERS[u] !== undefined && USERS[u] === p){
    currentUser = u;
    localStorage.setItem("dm_user", u);
    err.textContent = "";
    showList();
    setupPresence();
    setupNotifications();
  } else {
    err.textContent = "Usuário ou senha incorretos.";
  }
}

/* ---------------- NOTIFICAÇÕES PUSH ---------------- */
let fcmToken = null;

let swRegistration = null;

function setupNotifications(){
  if (!("serviceWorker" in navigator) || !("Notification" in window) || !firebase.messaging) {
    return; // navegador não suporta (comum em Safari fora do modo "Adicionar à Tela de Início")
  }
  if (!VAPID_KEY || VAPID_KEY === "COLE_AQUI_SUA_CHAVE_VAPID") {
    console.warn("Configure VAPID_KEY para ativar notificações push.");
    return;
  }

  navigator.serviceWorker.register("firebase-messaging-sw.js").then(registration => {
    swRegistration = registration;
    const messaging = firebase.messaging();

    // Mensagem chegou com o app aberto (primeiro plano): não mostra notificação
    // do sistema (senão duplicaria), só toca um som se não for a conversa aberta.
    messaging.onMessage(payload => {
      const chat = payload.data && payload.data.chat;
      if (chat && chat === currentChat) return;
      playNotificationSound();
    });

    if (Notification.permission === "granted") {
      // já foi liberado antes: pega o token direto, sem popup.
      getFcmToken(registration);
    } else if (Notification.permission === "default") {
      // ainda não foi perguntado: mostra o botão pro usuário tocar
      // (pedir sozinho, sem toque, o navegador ignora o popup).
      const btn = document.getElementById("notifyBtn");
      if (btn) btn.style.display = "inline-block";
    }
  }).catch(err => console.error("Erro ao registrar service worker:", err));
}

function enableNotifications(){
  if (!swRegistration) return;
  Notification.requestPermission().then(permission => {
    const btn = document.getElementById("notifyBtn");
    if (permission !== "granted") {
      if (permission === "denied" && btn) btn.style.display = "none";
      return;
    }
    if (btn) btn.style.display = "none";
    getFcmToken(swRegistration);
  });
}

function getFcmToken(registration){
  const messaging = firebase.messaging();
  messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration })
    .then(token => {
      if (!token) return;
      fcmToken = token;
      db.ref("tokens/" + currentUser + "/" + token).set(true);
    })
    .catch(err => console.error("Erro ao obter token de notificação:", err));
}

function playNotificationSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = 880;
    gain.gain.value = 0.15;
    osc.connect(gain).connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.15);
  } catch(e){}
}

function doLogout(){
  if (fcmToken && currentUser) {
    db.ref("tokens/" + currentUser + "/" + fcmToken).remove();
  }
  localStorage.removeItem("dm_user");
  currentUser = null;
  document.getElementById("login").style.display = "flex";
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "none";
}

/* ---------------- LISTA DE CONVERSAS ---------------- */
function showList(){
  document.getElementById("login").style.display = "none";
  document.getElementById("chatView").style.display = "none";
  document.getElementById("listView").style.display = "flex";

  const list = document.getElementById("chatList");
  list.innerHTML = "";

  list.appendChild(makeChatItem("Geral", "Chat geral do clã", () => openChat("general", "Geral")));

  Object.keys(USERS).filter(u => u !== currentUser).forEach(u => {
    list.appendChild(makeChatItem(u, "toque para conversar", () => {
      const chatId = [currentUser, u].sort().join("_");
      openChat(chatId, u);
    }));
  });
}

function makeChatItem(name, preview, onClick){
  const div = document.createElement("div");
  div.className = "chatItem";
  div.onclick = onClick;
  div.innerHTML = `
    ${avatarMarkup(name)}
    <div class="info">
      <div class="name">${escapeHtml(name)}</div>
      <div class="preview">${escapeHtml(preview)}</div>
    </div>`;
  return div;
}

/* ---------------- CHAT ---------------- */
function openChat(chatId, label){
  currentChat = chatId;
  currentChatLabel = label;
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "flex";
  const titleEl = document.getElementById("chatTitle");
  titleEl.textContent = label;
  titleEl.classList.toggle("channel", chatId === "general");
  document.getElementById("messages").innerHTML = "";

  const headerAvatar = document.getElementById("chatHeaderAvatar");
  headerAvatar.innerHTML = chatId === "general" ? "" : avatarMarkup(label);
  headerAvatar.style.display = chatId === "general" ? "none" : "block";

  const path = chatId === "general" ? "messages/general" : "messages/private/" + chatId;
  if (currentListener) currentListener.off();
  const ref = db.ref(path).limitToLast(200);
  ref.on("child_added", snap => {
    const box = document.getElementById("messages");
    renderMessage(snap.val());
    box.scrollTop = box.scrollHeight;
  });
  currentListener = ref;
}

function closeChat(){
  if (currentListener) currentListener.off();
  currentChat = null;
  showList();
}

function renderMessage(m){
  const box = document.getElementById("messages");
  const div = document.createElement("div");
  const mine = m.from === currentUser;
  div.className = "msg " + (mine ? "me" : "other");

  let content = "";
  if (m.type === "text") {
    content = escapeHtml(m.text);
  } else if (m.type === "image") {
    content = `<img src="${m.url}">`;
  } else if (m.type === "video") {
    content = `<video src="${m.url}" controls></video>`;
  } else if (m.type === "audio") {
    content = `<audio src="${m.url}" controls></audio>`;
  } else if (m.type === "file") {
    content = `<a class="fileLink" href="${m.url}" target="_blank">📎 ${escapeHtml(m.fileName || "arquivo")}</a>`;
    if (m.renamed) {
      content += `<div class="renameNote">⚠️ depois de baixar, apague o ".zip" do final do nome do arquivo</div>`;
    }
  }
  const t = new Date(m.timestamp);
  const time = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");

  div.innerHTML = `
    ${avatarMarkup(m.from)}
    <div class="body">
      <div class="head">
        <span class="sender">${escapeHtml(m.from)}</span>
        <span class="time">${time}</span>
      </div>
      <div class="content">${content}</div>
    </div>`;
  box.appendChild(div);
}

function avatarColor(name){
  const palette = ["#5865f2","#eb459e","#57f287","#fee75c","#ed4245","#00a8fc","#f47b67"];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return palette[Math.abs(hash) % palette.length];
}

function sendText(){
  const input = document.getElementById("textInput");
  const text = input.value.trim();
  if (!text) return;
  pushMessage({ type:"text", text: text });
  input.value = "";
}

function pushMessage(data){
  const path = currentChat === "general" ? "messages/general" : "messages/private/" + currentChat;
  db.ref(path).push({
    from: currentUser,
    timestamp: Date.now(),
    ...data
  });
}

const BLOCKED_EXT = ["exe","apk","bat","cmd","com","cpl","csh","dll","msc","msi","msp",
  "pif","ps1","scr","sh","vb","vbs","vbe","ws","wsf","wsc","wsh","jar"];

function isBlockedExt(name){
  const ext = name.split(".").pop().toLowerCase();
  return BLOCKED_EXT.includes(ext);
}

/* ---------------- ENVIO DE ARQUIVOS ---------------- */
function handleFile(event){
  const file = event.target.files[0];
  if (!file) return;

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "audio";

  // O Cloudinary bloqueia certas extensões (apk, exe, etc.) por segurança.
  // Contorno: renomeia escondendo a extensão antes de enviar; quem recebe
  // precisa apagar o ".zip" do final do nome depois de baixar.
  const blocked = type === "file" && isBlockedExt(file.name);
  const uploadTarget = blocked ? new File([file], file.name + ".zip", { type: file.type }) : file;

  const status = document.getElementById("uploadStatus");
  status.style.display = "block";
  status.textContent = "enviando... 0%";

  const formData = new FormData();
  formData.append("file", uploadTarget);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      status.textContent = "enviando... " + pct + "%";
    }
  };

  xhr.onload = () => {
    status.style.display = "none";
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      pushMessage({ type: type, url: res.secure_url, fileName: file.name, renamed: blocked });
    } else {
      let detail = xhr.responseText;
      try { detail = JSON.parse(xhr.responseText).error.message; } catch(e){}
      alert("Falha ao enviar arquivo (" + xhr.status + "): " + detail);
    }
  };

  xhr.onerror = () => {
    status.style.display = "none";
    alert("Falha de conexão ao enviar o arquivo.");
  };

  xhr.send(formData);
  event.target.value = "";
}

/* ---------------- FOTO DE PERFIL ---------------- */
function handleAvatarUpload(event){
  const file = event.target.files[0];
  if (!file) return;
  if (!file.type.startsWith("image/")) {
    alert("Escolha uma imagem para a foto de perfil.");
    event.target.value = "";
    return;
  }

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.onload = () => {
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("profiles/" + currentUser).update({ photoURL: res.secure_url });
    } else {
      alert("Falha ao enviar foto de perfil.");
    }
  };
  xhr.onerror = () => alert("Falha de conexão ao enviar a foto de perfil.");
  xhr.send(formData);
  event.target.value = "";
}

/* ---------------- UTIL ---------------- */
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
