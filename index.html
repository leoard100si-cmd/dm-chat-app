<style>
  :root{
    --bg:#313338;
    --bg-sidebar:#2b2d31;
    --bg-sidebar-dark:#1e1f22;
    --bg-input:#383a40;
    --border:#26282c;
    --text:#dbdee1;
    --text-bright:#f2f3f5;
    --text-dim:#949ba4;
    --blurple:#5865f2;
    --blurple-hover:#4752c4;
    --online:#23a55a;
    --danger:#f23f42;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"gg sans","Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
  }
  #app{height:100%;display:flex;flex-direction:column;}

  /* ---------- TELA DE LOGIN ---------- */
  #login{
    height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:16px;padding:24px;text-align:center;background:var(--bg-sidebar-dark);
  }
  #login h1{
    font-size:28px;margin:0;color:var(--text-bright);font-weight:700;
  }
  #login p.sub{color:var(--text-dim);margin:-8px 0 10px;font-size:15px;}
  #login input{
    width:100%;max-width:280px;padding:12px 14px;border-radius:22px;
    border:1px solid var(--border);background:var(--bg-sidebar);color:var(--text-bright);
    font-size:15px;outline:none;
  }
  #login input:focus{border-color:var(--blurple);}
  #login button{
    width:100%;max-width:280px;padding:12px;border-radius:22px;border:none;
    background:var(--blurple);color:#fff;font-weight:600;font-size:15px;
    cursor:pointer;
  }
  #login button:active{background:var(--blurple-hover);}
  #loginError{color:var(--danger);font-size:13px;min-height:18px;}

  /* ---------- LISTA DE CONVERSAS ---------- */
  #listView{height:100%;display:flex;flex-direction:column;background:var(--bg-sidebar);}
  #listHeader{
    display:flex;align-items:center;justify-content:space-between;
    padding:16px;border-bottom:1px solid var(--border);background:var(--bg-sidebar-dark);
    border-radius:0 0 18px 18px;
  }
  #listHeader h2{margin:0;font-size:16px;color:var(--text-bright);font-weight:700;}
  #logoutBtn{background:none;border:none;color:var(--text-dim);font-size:13px;cursor:pointer;}
  #listHeader .myProfile{display:flex;align-items:center;gap:10px;cursor:pointer;}
  #chatHeaderAvatar{width:32px;height:32px;flex-shrink:0;}
  #chatHeaderAvatar .avatar{width:32px;height:32px;font-size:13px;}
  #chatList{flex:1;overflow-y:auto;padding:8px;}
  .chatItem{
    display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:18px;cursor:pointer;
    position:relative;transition:background .1s ease;
  }
  .chatItem:hover{background:rgba(88,101,242,.10);}
  .chatItem:active{background:var(--bg-input);}
  .chatItem.activeChat{background:rgba(88,101,242,.14);}
  .chatItem.activeChat::before{
    content:"";position:absolute;left:0;top:16%;bottom:16%;width:4px;
    border-radius:0 4px 4px 0;background:var(--blurple);
  }
  .unreadDot{
    display:none;position:absolute;right:14px;top:12px;width:11px;height:11px;
    border-radius:50%;background:var(--danger);border:2.5px solid var(--bg-sidebar);
  }
  .unreadDot.show{display:block;}
  .avatar{
    width:40px;height:40px;border-radius:50%;background:var(--blurple);
    display:flex;align-items:center;justify-content:center;font-weight:700;
    color:#fff;flex-shrink:0;font-size:15px;position:relative;overflow:visible;
  }
  .avatar img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block;}
  .statusDot{
    position:absolute;right:-2px;bottom:-2px;width:12px;height:12px;border-radius:50%;
    background:var(--text-dim);border:2.5px solid var(--bg-sidebar);
  }
  .statusDot.online{background:var(--online);}
  .msg .avatar .statusDot{border-color:var(--bg);}
  #chatHeaderAvatar .statusDot{border-color:var(--bg);}
  .chatItem .info{flex:1;min-width:0;}
  .chatItem .name{font-weight:600;font-size:15px;color:var(--text-bright);}
  .chatItem .preview{color:var(--text-dim);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- TELA DE CHAT ---------- */
  #chatView{height:100%;display:none;flex-direction:column;background:var(--bg);}
  #chatHeader{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:var(--bg);box-shadow:0 1px 0 rgba(0,0,0,.15);
    border-radius:0 0 18px 18px;
  }
  #backBtn{background:none;border:none;color:var(--text-dim);font-size:22px;cursor:pointer;padding:0 4px;}
  #chatHeader .name.channel:before{content:"# ";color:var(--text-dim);}
  #chatHeader .name{font-weight:700;font-size:16px;color:var(--text-bright);}
  #messages{flex:1;overflow-y:auto;padding:12px 16px;display:flex;flex-direction:column;gap:2px;}
  .msg{
    display:flex;gap:14px;padding:8px 10px;border-radius:18px;font-size:15px;line-height:1.4;
    position:relative;animation:msgPop .16s ease-out;
  }
  @keyframes msgPop{
    0%{opacity:0;transform:translateY(6px) scale(.98);}
    100%{opacity:1;transform:translateY(0) scale(1);}
  }
  .msg:hover{background:rgba(0,0,0,.08);}
  .msg.highlight{background:rgba(88,101,242,.25);}
  .msg .avatar{margin-top:2px;}
  .msg .body{flex:1;min-width:0;}
  .msg .head{display:flex;align-items:baseline;gap:8px;}
  .msg .sender{font-size:15px;color:var(--text-bright);font-weight:600;}
  .msg.me .sender{color:var(--blurple);}
  .mention{
    background:rgba(88,101,242,.28);color:#c9cdfb;border-radius:4px;
    padding:0 3px;font-weight:600;
  }
  .mention.mentionMe{background:rgba(88,101,242,.55);color:#fff;}
  .reactionsRow{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  .reactionPill{
    background:var(--bg-input);border:1px solid var(--border);color:var(--text-bright);
    border-radius:12px;padding:2px 8px;font-size:12.5px;cursor:pointer;
  }
  .reactionPill.mine{background:rgba(88,101,242,.25);border-color:var(--blurple);}
  .msg .time{font-size:11px;color:var(--text-dim);}
  .msg .editedTag{font-size:10.5px;color:var(--text-dim);}
  .msg .content{color:var(--text);word-break:break-word;}
  .msg .content.deletedNote{color:var(--text-dim);font-style:italic;}
  .msg img,.msg video{max-width:320px;max-height:320px;border-radius:20px;display:block;margin-top:4px;}
  .msg audio{width:260px;margin-top:4px;border-radius:24px;}
  .msg a.fileLink{color:#00a8fc;text-decoration:underline;word-break:break-all;}
  .msg .renameNote{color:var(--text-dim);font-size:11.5px;margin-top:3px;}
  .msg .quote{
    border-left:3px solid var(--blurple);padding:4px 10px;margin-bottom:4px;
    background:rgba(88,101,242,.08);border-radius:6px;font-size:12.5px;
    color:var(--text-dim);cursor:pointer;max-width:280px;
  }
  .msg .quote b{color:var(--text-bright);display:block;font-size:12.5px;}
  .msg .actions{
    display:flex;gap:4px;align-self:flex-start;opacity:.55;flex-shrink:0;
  }
  .msg .actions button{
    background:var(--bg-input);border:none;color:var(--text-dim);
    width:26px;height:26px;border-radius:50%;font-size:12px;cursor:pointer;flex-shrink:0;
  }
  .msg .actions button:active{opacity:1;background:var(--blurple);color:#fff;}

  #typingIndicator{
    padding:2px 16px;min-height:16px;font-size:12px;color:var(--text-dim);
    font-style:italic;display:none;
  }

  #reactionPicker{
    position:fixed;inset:0;display:none;flex-direction:column;justify-content:flex-end;
    background:rgba(0,0,0,.4);z-index:70;
  }
  #reactionPickerBar{
    background:var(--bg-sidebar);border-radius:18px 18px 0 0;padding:16px;
    display:flex;justify-content:space-around;
  }
  #reactionPickerBar button{
    background:none;border:none;font-size:26px;cursor:pointer;padding:6px;
  }
  #reactionPickerBar button:active{transform:scale(1.2);}

  #replyBar{
    display:none;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 16px;background:var(--bg-input);border-left:3px solid var(--blurple);
    margin:0 16px;border-radius:10px 10px 0 0;font-size:12.5px;color:var(--text-dim);
  }
  #replyBar b{color:var(--text-bright);}
  #replyBar button{background:none;border:none;color:var(--text-dim);font-size:16px;cursor:pointer;flex-shrink:0;}

  #inputBar{
    display:flex;align-items:center;gap:8px;padding:12px 16px 16px;background:var(--bg);
  }
  #inputBar input[type=text]{
    flex:1;padding:12px 16px;border-radius:24px;border:none;
    background:var(--bg-input);color:var(--text-bright);font-size:15px;outline:none;
  }
  #attachBtn,#sendBtn{
    background:none;border:none;color:var(--text-dim);
    width:36px;height:36px;border-radius:50%;font-size:18px;cursor:pointer;flex-shrink:0;
  }
  #attachBtn:active,#sendBtn:active{background:var(--bg-input);}
  #sendBtn{color:var(--blurple);}
  #fileInput{display:none;}
  #uploadStatus{
    text-align:center;font-size:12px;color:var(--text-dim);padding:4px;display:none;
  }

  /* ---------- SCROLLBAR CUSTOMIZADA ---------- */
  #messages::-webkit-scrollbar, #chatList::-webkit-scrollbar,
  #animeResults::-webkit-scrollbar, #stickerGrid::-webkit-scrollbar,
  #callChatMessages::-webkit-scrollbar, #membersList::-webkit-scrollbar,
  #packTabs::-webkit-scrollbar, #participantsGrid::-webkit-scrollbar{
    width:6px;height:6px;
  }
  #messages::-webkit-scrollbar-track, #chatList::-webkit-scrollbar-track,
  #animeResults::-webkit-scrollbar-track, #stickerGrid::-webkit-scrollbar-track,
  #callChatMessages::-webkit-scrollbar-track, #membersList::-webkit-scrollbar-track,
  #packTabs::-webkit-scrollbar-track, #participantsGrid::-webkit-scrollbar-track{
    background:transparent;
  }
  #messages::-webkit-scrollbar-thumb, #chatList::-webkit-scrollbar-thumb,
  #animeResults::-webkit-scrollbar-thumb, #stickerGrid::-webkit-scrollbar-thumb,
  #callChatMessages::-webkit-scrollbar-thumb, #membersList::-webkit-scrollbar-thumb,
  #packTabs::-webkit-scrollbar-thumb, #participantsGrid::-webkit-scrollbar-thumb{
    background:rgba(88,101,242,.35);border-radius:10px;
  }
  #messages:hover::-webkit-scrollbar-thumb, #chatList:hover::-webkit-scrollbar-thumb,
  #animeResults:hover::-webkit-scrollbar-thumb, #membersList:hover::-webkit-scrollbar-thumb{
    background:var(--blurple);
  }

  /* ---------- MODO COMPACTO ---------- */
  body.compact .msg{padding:1px 10px;gap:8px;}
  body.compact .msg .avatar{width:20px;height:20px;font-size:11px;margin-top:1px;}
  body.compact .msg .head{gap:6px;}
  body.compact .msg .content{font-size:14.5px;}
  body.compact .msg .quote{max-width:220px;}

  /* ---------- MEMBROS ONLINE ---------- */
  #membersModal{
    position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
    padding:16px;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  }
  #membersPanel{
    width:min(360px,100%);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
    background:var(--bg);border:1px solid var(--border);border-radius:16px;
    box-shadow:0 24px 90px rgba(0,0,0,.65);
  }
  #membersHeader{display:flex;align-items:center;gap:10px;padding:16px 18px 8px;flex-shrink:0;}
  #membersHeader b{color:var(--text-bright);font-size:16px;flex:1;}
  #membersHeader button{background:var(--bg-input);border:0;color:var(--text-dim);width:28px;height:28px;border-radius:50%;font-size:13px;cursor:pointer;flex-shrink:0;}
  #membersList{overflow-y:auto;padding:6px 12px 16px;}
  .memberGroupTitle{
    color:var(--text-dim);font-size:12px;font-weight:700;text-transform:uppercase;
    letter-spacing:.03em;padding:12px 6px 6px;
  }
  .memberRow{display:flex;align-items:center;gap:10px;padding:6px;border-radius:10px;}
  .memberRow .name{font-size:14px;color:var(--text-bright);font-weight:600;}


  /* ---------- MEUS ANIMES ---------- */
  #animeModal{
    position:fixed;inset:0;z-index:9999;display:none;align-items:center;justify-content:center;
    padding:12px;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);
  }
  #animePanel{
    width:min(1100px,100%);height:min(760px,96vh);display:flex;flex-direction:column;
    overflow:hidden;background:var(--bg);border:1px solid var(--border);border-radius:18px;
    box-shadow:0 24px 90px rgba(0,0,0,.65);
  }
  #animePanel.anime-frame-open{height:auto;max-height:96vh;}
  @media (max-width:700px){
    #animeModal{padding:0;align-items:flex-start;}
    #animePanel{width:100%;max-width:none;border-radius:0 0 18px 18px;}
    #animePanel.anime-frame-open{max-height:100vh;}
  }
  #animeHeader{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  #animeHeader .name{font-weight:800;font-size:16px;color:var(--text-bright);flex:1;}
  #animeAddBtn,#animeClose{background:var(--bg-input);border:0;color:var(--text-dim);width:34px;height:34px;border-radius:50%;font-size:16px;cursor:pointer;flex-shrink:0;}
  #animeSearchWrap{padding:10px 16px;border-bottom:1px solid var(--border);flex-shrink:0;}
  #animeSearch{width:100%;box-sizing:border-box;padding:11px 14px;border:1px solid var(--border);border-radius:12px;
    background:var(--bg-input);color:var(--text-bright);outline:none;font-size:14px;}
  #animeResults{overflow-y:auto;padding:12px 16px 18px;flex:1;}
  .animeCard{border:1px solid var(--border);background:var(--bg-sidebar);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;align-items:center;gap:10px;cursor:pointer;}
  .animeCard:active{transform:scale(.995);}
  .animeCard .animeCardInfo{flex:1;min-width:0;}
  .animeTitle{font-weight:800;color:var(--text-bright);font-size:15px;margin-bottom:4px;}
  .animeMeta{font-size:12px;color:var(--text-dim);}
  .animeEpisodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;}
  .animeEp{padding:10px 8px;border:1px solid var(--border);border-radius:10px;background:var(--bg-input);
    color:var(--text-bright);cursor:pointer;font-size:13px;text-align:center;}
  .animeEp:active{transform:scale(.98);}
  .animeEmpty{padding:28px 8px;text-align:center;color:var(--text-dim);font-size:13px;}
  .animeBackRow{display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap;}
  .animeBackRow button,.animeMore{border:1px solid var(--border);background:var(--bg-input);color:var(--text-bright);padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px;}
  .animeDelBtn{margin-left:auto;background:none;border:0;color:var(--danger);font-size:16px;cursor:pointer;padding:4px 6px;}
  .animeSelectedTitle{font-weight:800;color:var(--text-bright);font-size:18px;margin-bottom:3px;}
  .animeSelectedMeta{margin-bottom:12px;}
  #animeUploadStatus{display:none;padding:8px 16px;font-size:12px;color:var(--text-dim);border-bottom:1px solid var(--border);flex-shrink:0;}
  #animeFrameWrap{display:none;flex:0 0 auto;background:#000;padding:12px 16px;flex-shrink:0;}
  #animeVideoPlayer{width:100%;max-height:60vh;border-radius:12px;display:block;background:#000;}
  #animeWatchTogetherBtn{
    width:100%;margin-top:10px;padding:11px;border:none;border-radius:12px;
    background:var(--blurple);color:#fff;font-weight:700;font-size:13.5px;cursor:pointer;
  }
  .animeEnd{font-size:12px;color:var(--text-dim);padding:10px 0 0;}

  /* ---------- SALA DE VÍDEO (CALL) ---------- */
  #callView{
    height:100%;display:none;flex-direction:column;background:var(--bg);position:relative;
  }
  #callHeader{
    display:flex;align-items:center;gap:10px;padding:12px 16px;
    border-bottom:1px solid var(--border);background:var(--bg);
    border-radius:0 0 18px 18px;
  }
  #callHeader .name{font-weight:700;font-size:16px;color:var(--text-bright);flex:1;}
  #callAdminTag{font-size:12px;color:var(--text-dim);}
  #playerWrap{
    position:relative;background:#000;margin:10px 16px 0;border-radius:14px;
    overflow:hidden;flex-shrink:0;aspect-ratio:16/9;
  }
  #sharedPlayer{width:100%;height:100%;display:block;background:#000;}
  #playerOverlay{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    color:var(--text-dim);font-size:13px;text-align:center;padding:16px;background:rgba(0,0,0,.3);
  }
  #adminControls{
    display:none;flex-direction:column;gap:8px;padding:8px 16px;flex-shrink:0;
  }
  #adminControls select{
    width:100%;padding:8px 10px;border-radius:12px;border:1px solid var(--border);
    background:var(--bg-input);color:var(--text-bright);font-size:13px;outline:none;
  }
  #adminPlaybackRow{
    display:flex;align-items:center;gap:8px;
  }
  #adminControls button{
    background:var(--bg-input);border:none;color:var(--text-bright);
    height:34px;border-radius:50%;font-size:14px;cursor:pointer;flex-shrink:0;
  }
  #playPauseBtn{width:34px;}
  #seekBackBtn,#seekFwdBtn{
    width:auto;border-radius:16px;padding:0 10px;font-size:11.5px;font-weight:700;
  }
  #callMusicUploadStatus{
    display:none;padding:6px 16px 0;font-size:12px;color:var(--text-dim);
  }
  #seekBar{flex:1;max-width:none;}
  #participantsGrid{
    flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(2,1fr);
    gap:8px;padding:10px 16px;align-content:start;
  }
  .callTile{
    position:relative;background:var(--bg-sidebar);border-radius:14px;overflow:hidden;
    aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;
  }
  .callTile audio{display:none;}
  .callTileAvatarWrap{
    width:58px;height:58px;border-radius:50%;flex-shrink:0;

<script>
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

let currentUser = null;
let currentChat = null;      // "general" ou id do chat privado
let currentChatLabel = "";
let currentListener = null;
let friendsRef = null;
let profilePhotos = {};      // { usuario: url }
let profilesFull = {};       // { usuario: {photoURL, statusText} }
let statusData = {};         // { usuario: {state, last_changed} }
let dynamicMembers = {};     // { usuario: {pass, role, addedBy} } - cadastrados por convite
const OWNER_NAME = "Leo"; // dono padrão do clã (dá pra promover outros a "admin" pelo botão 🛠️)
let messagesCache = {};      // { key: dadosDaMensagem } - conversa aberta no momento
let replyingTo = null;       // { id, from, preview } ou null
let unreadListeners = [];    // listeners de mensagem não lida na lista de conversas
let typingRef = null;        // referência do Firebase pra "está digitando" do chat aberto
let typingTimeout = null;
let reactingToKey = null;    // mensagem sendo reagida no momento

/* ---------------- MODO COMPACTO / CONFORTÁVEL ---------------- */
if (localStorage.getItem("dm_density") === "compact") {
  document.body.classList.add("compact");
}
function toggleDensity(){
  document.body.classList.toggle("compact");
  localStorage.setItem("dm_density", document.body.classList.contains("compact") ? "compact" : "comfortable");
}

/* ---------------- PRESENÇA (online/offline) ---------------- */
function setupPresence(){
  const myStatusRef = db.ref("status/" + currentUser);
  db.ref(".info/connected").on("value", snap => {
    if (snap.val() === false) return;
    myStatusRef.onDisconnect().set({
      state: "offline",
      last_changed: firebase.database.ServerValue.TIMESTAMP
    }).then(() => {
      myStatusRef.set({
        state: "online",
        last_changed: firebase.database.ServerValue.TIMESTAMP
      });
    });
  });

  db.ref("status").on("value", snap => {
    statusData = snap.val() || {};
    refreshAllAvatars();
  });

  db.ref("profiles").on("value", snap => {
    const data = snap.val() || {};
    profilePhotos = {};
    profilesFull = data;
    Object.keys(data).forEach(u => {
      if (data[u] && data[u].photoURL) profilePhotos[u] = data[u].photoURL;
    });
    refreshAllAvatars();
  });
}

// Atualiza só o CONTEÚDO dos avatares já existentes na tela (sem recriar
// as mensagens inteiras), pra não reiniciar vídeos/áudios em reprodução.
function refreshAllAvatars(){
  document.querySelectorAll(".avatar[data-user]").forEach(el => {
    const name = el.getAttribute("data-user");
    el.innerHTML = avatarInnerHtml(name);
    if (profilePhotos[name]) {
      el.style.background = "";
    } else {
      el.style.background = avatarColor(name);
    }
  });
  const my = document.getElementById("myAvatar");
  if (my) {
    my.className = "avatar";
    my.setAttribute("data-user", currentUser);
    my.innerHTML = avatarInnerHtml(currentUser);
    my.style.background = profilePhotos[currentUser] ? "" : avatarColor(currentUser);
  }
  const membersModal = document.getElementById("membersModal");
  if (membersModal && membersModal.style.display === "flex") renderMembersList();
}

/* ---------------- MEMBROS ONLINE ---------------- */
function openMembersModal(){
  renderMembersList();
  document.getElementById("membersModal").style.display = "flex";
}
function closeMembersModal(){
  document.getElementById("membersModal").style.display = "none";
}
function renderMembersList(){
  const root = document.getElementById("membersList");
  if (!root) return;
  const all = allGeralMembers();
  const online = all.filter(isOnline);
  const offline = all.filter(u => !isOnline(u));
  const row = name => `<div class="memberRow">${avatarMarkup(name)}<span class="name${roleClass(name)}">${escapeHtml(name)}${roleBadge(name)}</span></div>`;
  root.innerHTML =
    `<div class="memberGroupTitle">Online — ${online.length}</div>` +
    (online.length ? online.map(row).join("") : `<div class="animeEmpty">Ninguém online agora.</div>`) +
    `<div class="memberGroupTitle">Offline — ${offline.length}</div>` +
    offline.map(row).join("");
}

function isOnline(name){
  return !!(statusData[name] && statusData[name].state === "online");
}

function avatarInnerHtml(name){
  const photo = profilePhotos[name];
  const inner = photo ? `<img src="${photo}">` : name.charAt(0).toUpperCase();
  const dot = memberExists(name)
    ? `<span class="statusDot ${isOnline(name) ? "online" : ""}"></span>`
    : "";
  return inner + dot;
}

function avatarMarkup(name, extraStyle){
  const photo = profilePhotos[name];
  const bg = photo ? "" : ("background:" + avatarColor(name) + ";");
  return `<div class="avatar${roleClass(name)}" data-user="${escapeHtml(name)}" style="${bg}${extraStyle||""}">${avatarInnerHtml(name)}</div>`;
}

/* ---------------- CARGOS (dono / admin / membro) ---------------- */
function memberExists(name){
  return USERS[name] !== undefined || dynamicMembers[name] !== undefined;
}
function checkPassword(name, pass){
  if (USERS[name] !== undefined) return USERS[name] === pass;
  if (dynamicMembers[name]) return dynamicMembers[name].pass === pass;
  return false;
}
function isGeralMember(name){
  return GERAL_MEMBERS.includes(name) || dynamicMembers[name] !== undefined;
}
function allGeralMembers(){
  const extra = Object.keys(dynamicMembers).filter(n => !GERAL_MEMBERS.includes(n));
  return GERAL_MEMBERS.concat(extra);
}
function getRole(name){
  if (dynamicMembers[name] && dynamicMembers[name].role) return dynamicMembers[name].role;
  if (name === OWNER_NAME) return "dono";
  return "membro";
}
function isStaff(name){
  const r = getRole(name);
  return r === "dono" || r === "admin";
}
function roleClass(name){
  const r = getRole(name);
  return r === "dono" ? " role-dono" : (r === "admin" ? " role-admin" : "");
}
function roleBadge(name){
  const r = getRole(name);
  if (r === "dono") return '<span class="roleBadge" title="Dono do clã">\ud83d\udc51</span>';
  if (r === "admin") return '<span class="roleBadge" title="Admin">\u2699\ufe0f</span>';
  return "";
}
function refreshRoleUI(){
  const invite = document.getElementById("inviteBtn");
  const roles = document.getElementById("rolesBtn");
  const staff = !!(currentUser && isStaff(currentUser));
  if (invite) invite.style.display = staff ? "inline-flex" : "none";
  if (roles) roles.style.display = staff ? "inline-flex" : "none";
}
function setupMembers(){
  db.ref("members").on("value", snap => {
    dynamicMembers = snap.val() || {};
    refreshRoleUI();
    refreshAllAvatars();
  });
}

/* ---------------- PONTE COM APP NATIVO (Kodular) ----------------

function notifyNativeApp(username){

    }

async function doLogin(){
  const u = document.getElementById("loginUser").value.trim();
  const p = document.getElementById("loginPass").value;
  const err = document.getElementById("loginError");
  err.textContent = "Entrando...";
  let ok = false;
  try {
    const r = await fetch(VIDEO_API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: u, pass: p }) });
    if (r.ok){ localStorage.setItem("dm_token", (await r.json()).token); ok = true; }
    else if (r.status !== 401){ err.textContent = "Servidor indisponível, tenta de novo."; return; }
  } catch(e){ err.textContent = "Sem conexão com o servidor."; return; }
  if (ok){
    currentUser = u;
    localStorage.setItem("dm_user", u);
    err.textContent = "";
    db.ref("entryLog").push({ user: u, action: "login", ts: firebase.database.ServerValue.TIMESTAMP });
    refreshRoleUI();
    showList();
    setupPresence();
    setupNotifications();
    notifyNativeApp(currentUser);
  } else {
    err.textContent = "Usuário ou senha incorretos.";
  }
}

/* ---------------- NOTIFICAÇÕES PUSH ---------------- */
let fcmToken = null;

let swRegistration = null;

function setupNotifications(){
  if (!("serviceWorker" in navigator) || !("Notification" in window) || !firebase.messaging) {
    return; // navegador não suporta (comum em Safari fora do modo "Adicionar à Tela de Início")
  }
  if (!VAPID_KEY || VAPID_KEY === "COLE_AQUI_SUA_CHAVE_VAPID") {
    console.warn("Configure VAPID_KEY para ativar notificações push.");
    return;
  }

  navigator.serviceWorker.register("firebase-messaging-sw.js").then(registration => {
    swRegistration = registration;
    const messaging = firebase.messaging();

    // Mensagem chegou com o app aberto (primeiro plano): não mostra notificação
    // do sistema (senão duplicaria), só toca um som se não for a conversa aberta.
    messaging.onMessage(payload => {
      const chat = payload.data && payload.data.chat;
      if (chat && chat === currentChat) return;
      playNotificationSound();
    });

    if (Notification.permission === "granted") {
      // já foi liberado antes: pega o token direto, sem popup.
      getFcmToken(registration);
    } else if (Notification.permission === "default") {
      // ainda não foi perguntado: mostra o botão pro usuário tocar
      // (pedir sozinho, sem toque, o navegador ignora o popup).
      const btn = document.getElementById("notifyBtn");
      if (btn) btn.style.display = "inline-block";
    }
  }).catch(err => console.error("Erro ao registrar service worker:", err));
}

// ---------- INSTALAR APP (PWA) ----------
// O navegador dispara esse evento quando o site cumpre os requisitos
// pra virar app (manifest.json + service worker + https). Guardamos
// o evento pra poder mostrar o prompt de instalação quando o usuário
// tocar no botão, em vez de depender só do menu do navegador.
let deferredInstallPrompt = null;

window.addEventListener("beforeinstallprompt", (event) => {
  event.preventDefault();
  deferredInstallPrompt = event;
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "inline-block";
});

function installApp(){
  const btn = document.getElementById("installBtn");
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  deferredInstallPrompt.userChoice.finally(() => {
    deferredInstallPrompt = null;
    if (btn) btn.style.display = "none";
  });
}

// Já instalado (aberto a partir do ícone na tela inicial): esconde o botão.
window.addEventListener("appinstalled", () => {
  const btn = document.getElementById("installBtn");
  if (btn) btn.style.display = "none";
});

function enableNotifications(){
  if (!swRegistration) return;
  Notification.requestPermission().then(permission => {
    const btn = document.getElementById("notifyBtn");
    if (permission !== "granted") {
      if (permission === "denied" && btn) btn.style.display = "none";
      return;
    }
    if (btn) btn.style.display = "none";
    getFcmToken(swRegistration);
  });
}

function getFcmToken(registration){
  const messaging = firebase.messaging();
  messaging.getToken({ vapidKey: VAPID_KEY, serviceWorkerRegistration: registration })
    .then(token => {
      if (!token) return;
      fcmToken = token;
      db.ref("tokens/" + currentUser + "/" + token).set(true);
    })
    .catch(err => console.error("Erro ao obter token de notificação:", err));
}

function playNotificationSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const blip = (freq, start, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = 0.0001;
      gain.gain.exponentialRampToValueAtTime(0.18, ctx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.02);
    };
    blip(830, 0, 0.09);
    blip(1244, 0.08, 0.14);
  } catch(e){}
}

function playMentionSound(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const blip = (freq, start, dur) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = "sine";
      osc.frequency.value = freq;
      gain.gain.value = 0.0001;
      gain.gain.exponentialRampToValueAtTime(0.22, ctx.currentTime + start + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + start + dur);
      osc.connect(gain).connect(ctx.destination);
      osc.start(ctx.currentTime + start);
      osc.stop(ctx.currentTime + start + dur + 0.02);
    };
    blip(988, 0, 0.09);
    blip(988, 0.12, 0.09);
    blip(1480, 0.24, 0.16);
  } catch(e){}
}

// também está nessa lista, como se já fizessem parte do mesmo servidor.
function ensureGeralFriends(){
  if (!isGeralMember(currentUser)) return;
  allGeralMembers().filter(u => u !== currentUser).forEach(u => {
    db.ref("friends/" + currentUser + "/" + u).set(true);
  });
}

function renderChatList(friends){
  unreadListeners.forEach(o => o.ref.off("value", o.cb));
  unreadListeners = [];

  const list = document.getElementById("chatList");
  list.innerHTML = "";

  list.appendChild(makeChatItem("📹 Sala de Vídeo", "toque para entrar na call", () => openCallRoom("callRoom", "videoLibrary", "📹 Sala de Vídeo")));
  list.appendChild(makeChatItem("🎵 Sala de Música", "toque para escutar junto", () => openCallRoom("musicRoom", "musicLibrary", "🎵 Sala de Música")));

  if (isGeralMember(currentUser)){
    list.appendChild(makeChatItem("Geral", "Chat geral do clã", () => openChat("general", "Geral"), "general"));
  }

  Object.keys(friends).filter(u => u !== currentUser).forEach(u => {
    const status = (profilesFull[u] && profilesFull[u].statusText) || "";
    const chatId = [currentUser, u].sort().join("_");
    list.appendChild(makeChatItem(u, status || "toque para conversar", () => {
      openChat(chatId, u);
    }, chatId));
  });

  if (Object.keys(friends).length === 0){
    const hint = document.createElement("div");
    hint.style.cssText = "padding:16px;color:#888;text-align:center;";
    hint.textContent = "Você ainda não adicionou ninguém. Toque em ＋ e digite o nick.";

/* ---------------- MENSAGEM NÃO LIDA (pontinho vermelho) ---------------- */
function markChatRead(chatId){
  if (!chatId) return;
  localStorage.setItem("dm_lastChat", chatId);
  db.ref("lastRead/" + currentUser + "/" + chatId).set(Date.now());
}
function watchUnread(chatId, dotEl){
  const path = chatId === "general" ? "messages/general" : "messages/private/" + chatId;
  const ref = db.ref(path).limitToLast(1);
  const cb = snap => {
    let last = null;
    snap.forEach(child => { last = child.val(); });
    if (!last || last.from === currentUser){
      dotEl.classList.remove("show");
      return;
    }
    db.ref("lastRead/" + currentUser + "/" + chatId).once("value").then(rsnap => {
      const lastRead = rsnap.val() || 0;
      dotEl.classList.toggle("show", (last.timestamp || 0) > lastRead);
    });
  };
  ref.on("value", cb);
  unreadListeners.push({ ref, cb });
}

/* ---------------- CHAT ---------------- */
function openChat(chatId, label){
  if (chatId === "general" && !isGeralMember(currentUser)) return;
  currentChat = chatId;
  currentChatLabel = label;
  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "flex";
  const titleEl = document.getElementById("chatTitle");
  const statusEl = document.getElementById("chatHeaderStatus");
  titleEl.innerHTML = escapeHtml(label) + (chatId !== "general" ? roleBadge(label) : "");
  titleEl.className = "name" + (chatId === "general" ? " channel" : "") + (chatId !== "general" ? roleClass(label) : "");
  const dmStatus = chatId !== "general" && profilesFull[label] && profilesFull[label].statusText;
  if (dmStatus){
    statusEl.textContent = dmStatus;
    statusEl.style.display = "block";
  } else {
    statusEl.style.display = "none";
  }
  document.getElementById("messages").innerHTML = "";
  messagesCache = {};
  cancelReply();

  const headerAvatar = document.getElementById("chatHeaderAvatar");
  headerAvatar.innerHTML = chatId === "general" ? "" : avatarMarkup(label);
  headerAvatar.style.display = chatId === "general" ? "none" : "block";

  markChatRead(chatId);

  if (typingRef) { typingRef.off(); typingRef = null; }
  document.getElementById("typingIndicator").style.display = "none";
  typingRef = db.ref("typing/" + chatId);
  db.ref("typing/" + chatId + "/" + currentUser).onDisconnect().remove();
  typingRef.on("value", snap => {
    const data = snap.val() || {};
    const others = Object.keys(data).filter(u => u !== currentUser && data[u]);
    const el = document.getElementById("typingIndicator");
    if (others.length){
      el.textContent = others.join(", ") + (others.length > 1 ? " estão digitando..." : " está digitando...");
      el.style.display = "block";
    } else {
      el.style.display = "none";
    }
  });

  const path = chatId === "general" ? "messages/general" : "messages/private/" + chatId;
  if (currentListener) currentListener.off();
  const ref = db.ref(path).limitToLast(200);
  ref.on("child_added", snap => {
    const box = document.getElementById("messages");
    const m = snap.val();
    messagesCache[snap.key] = m;
    box.appendChild(buildMessageEl(snap.key, m));
    box.scrollTo({ top: box.scrollHeight, behavior: "smooth" });
    if (m.from !== currentUser && m.type === "text" && new RegExp("(^|\\s)@" + currentUser + "(\\s|$)").test(m.text)){
      playMentionSound();
    }
  });
  ref.on("child_changed", snap => {
    messagesCache[snap.key] = snap.val();
    const old = document.querySelector('.msg[data-key="' + snap.key + '"]');
    if (old) old.replaceWith(buildMessageEl(snap.key, snap.val()));
  });
  ref.on("child_removed", snap => {
    delete messagesCache[snap.key];
    const old = document.querySelector('.msg[data-key="' + snap.key + '"]');
    if (old) old.remove();
  });
  currentListener = ref;
}

function previewFor(m){
  if (m.type === "text") return m.text.length > 60 ? m.text.slice(0,60) + "…" : m.text;
  if (m.type === "image") return "📷 imagem";
  if (m.type === "video") return "🎥 vídeo";
  if (m.type === "audio") return "🎤 áudio";
  if (m.type === "file") return "📎 " + (m.fileName || "arquivo");
  if (m.type === "sticker") return "🏷️ figurinha";
  return "";
}

function buildMessageEl(key, m){
  const div = document.createElement("div");
  const mine = m.from === currentUser;
  div.className = "msg " + (mine ? "me" : "other");
  div.dataset.key = key;

  let content = "";
  if (m.type === "text") {
    content = highlightMentions(m.text);
  } else if (m.type === "image") {
    content = `<img src="${m.url}">`;
  } else if (m.type === "video") {
    content = m.vid
      ? `<video data-vid="${escapeHtml(m.vid)}" controls playsinline preload="metadata" controlsList="nodownload" disablePictureInPicture oncontextmenu="return false"></video>`
      : `<video src="${m.url}" controls></video>`;
  } else if (m.type === "audio") {
    content = `<audio src="${m.url}" controls></audio>`;
  } else if (m.type === "file") {
    content = `<a class="fileLink" href="${m.url}" target="_blank">📎 ${escapeHtml(m.fileName || "arquivo")}</a>`;
    if (m.renamed) {
      content += `<div class="renameNote">⚠️ depois de baixar, apague o ".zip" do final do nome do arquivo</div>`;
    }
  } else if (m.type === "sticker") {
    content = `<img class="stickerImg" src="${m.url}">`;
  }
  const t = new Date(m.timestamp);
  const time = String(t.getHours()).padStart(2,"0") + ":" + String(t.getMinutes()).padStart(2,"0");
  const editedTag = m.edited ? `<span class="editedTag">(editado)</span>` : "";

  let quoteHtml = "";
  if (m.replyTo) {
    quoteHtml = `<div class="quote" onclick="scrollToMessage('${m.replyTo.id}')"><b>${escapeHtml(m.replyTo.from)}</b>${escapeHtml(m.replyTo.preview)}</div>`;
  }

  const actionsHtml = `
    <div class="actions">
      <button title="Reagir" onclick="openReactionPicker('${key}')">🙂</button>
      <button title="Responder" onclick="startReply('${key}')">↩</button>
      ${mine && m.type === "text" ? `<button title="Editar" onclick="startEdit('${key}')">✎</button>` : ""}
      ${mine ? `<button title="Excluir" onclick="deleteMsg('${key}')">🗑</button>` : ""}
    </div>`;

  const reactions = m.reactions || {};
  const reactionsHtml = Object.keys(reactions).map(emoji => {
    const users = Object.keys(reactions[emoji] || {}).filter(u => reactions[emoji][u]);
    if (!users.length) return "";
    const mineReacted = users.includes(currentUser);
    return `<button class="reactionPill${mineReacted ? " mine" : ""}" onclick="toggleReaction('${key}','${emoji}')">${emoji} ${users.length}</button>`;
  }).join("");

  div.innerHTML = `
    ${avatarMarkup(m.from)}
    <div class="body">
      <div class="head">
        <span class="sender${roleClass(m.from)}">${escapeHtml(m.from)}${roleBadge(m.from)}</span>
        <span class="time">${time}</span>
        ${editedTag}
      </div>
      ${quoteHtml}
      <div class="content${m.type === "sticker" ? " stickerContent" : ""}">${content}</div>
      ${reactionsHtml ? `<div class="reactionsRow">${reactionsHtml}</div>` : ""}
    </div>
    ${actionsHtml}`;
  return div;
}

function highlightMentions(text){
  const escaped = escapeHtml(text);
  return escaped.replace(/@([A-Za-zÀ-ÿ0-9_]+)/g, (match, name) => {
    if (!memberExists(name)) return match;
    return `<span class="mention${name === currentUser ? " mentionMe" : ""}">@${name}</span>`;
  });
}

function avatarColor(name){
  const palette = ["#5865f2","#eb459e","#57f287","#fee75c","#ed4245","#00a8fc","#f47b67"];
  let hash = 0;
  for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
  return palette[Math.abs(hash) % palette.length];
}

function pushMessage(data){
  const path = currentChat === "general" ? "messages/general" : "messages/private/" + currentChat;
  db.ref(path).push({
    from: currentUser,
    timestamp: Date.now(),

  });

const BLOCKED_EXT = ["exe","apk","bat","cmd","com","cpl","csh","dll","msc","msi","msp",
  "pif","ps1","scr","sh","vb","vbs","vbe","ws","wsf","wsc","wsh","jar"];

function isBlockedExt(name){
  const ext = name.split(".").pop().toLowerCase();
  return BLOCKED_EXT.includes(ext);
}

/* ---------------- VÍDEOS PROTEGIDOS (Worker + Cloudinary privado) ---------------- */
async function getVideoToken(u, p){
  try {
    const r = await fetch(VIDEO_API + "/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ user: u, pass: p }) });
    if (r.ok) localStorage.setItem("dm_token", (await r.json()).token);
  } catch(e){}
}
async function vidApi(path, body){
  const r = await fetch(VIDEO_API + path, {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + (localStorage.getItem("dm_token") || "") },
    body: JSON.stringify(body || {})
  });
  if (r.status === 401){
    localStorage.removeItem("dm_token");
    alert("Sessão expirada. Entra de novo pra ver os vídeos.");
    doLogout();
    throw new Error("sessão expirada");
  }
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function sendVideoSigned(file){
  const status = document.getElementById("uploadStatus");
  status.style.display = "block";
  status.textContent = "enviando... 0%";
  try {
    const s = await vidApi("/sign-upload");
    const fd = new FormData();
    fd.append("file", file);
    fd.append("api_key", s.api_key);
    fd.append("timestamp", s.timestamp);
    fd.append("signature", s.signature);
    fd.append("type", s.type);
    fd.append("folder", s.folder);
    const res = await new Promise((ok, fail) => {
      const xhr = new XMLHttpRequest();
      xhr.open("POST", "https://api.cloudinary.com/v1_1/" + s.cloud + "/video/upload");
      xhr.upload.onprogress = (e) => { if (e.lengthComputable) status.textContent = "enviando... " + Math.round(e.loaded / e.total * 100) + "%"; };
      xhr.onload = () => {
        if (xhr.status >= 200 && xhr.status < 300) return ok(JSON.parse(xhr.responseText));
        let d = xhr.responseText; try { d = JSON.parse(d).error.message; } catch(e){}
        fail(new Error(d));
      };
      xhr.onerror = () => fail(new Error("falha de conexão"));
      xhr.send(fd);
    });
    pushMessage({ type: "video", vid: "cld:" + res.public_id + "." + res.format, fileName: file.name });
  } catch(e){
    alert("Falha ao enviar vídeo: " + e.message);
  }
  status.style.display = "none";
}
async function secureVideo(v, retried){
  try {
    const j = await vidApi("/play", { v: v.dataset.vid });
    v.src = j.url;
  } catch(e){}
  if (!retried) v.addEventListener("error", () => secureVideo(v, true), { once: true });
}
async function explainVideoError(src){
  const ctrl = new AbortController();
  try {
    const r = await fetch(src, { signal: ctrl.signal });
    if (!r.ok) alert("Erro no vídeo (" + r.status + "): " + (await r.text()).slice(0, 200));
    ctrl.abort();
  } catch(e){}
}
new MutationObserver(() => {
  document.querySelectorAll("video[data-vid]:not([data-h])").forEach(v => { v.dataset.h = "1"; secureVideo(v); });
}).observe(document.documentElement, { childList: true, subtree: true });

/* ---------------- ENVIO DE ARQUIVOS ---------------- */
function handleFile(event){
  const file = event.target.files[0];
  if (!file) return;

  let type = "file";
  if (file.type.startsWith("image/")) type = "image";
  else if (file.type.startsWith("video/")) type = "video";
  else if (file.type.startsWith("audio/")) type = "audio";

  // Vídeos vão pelo caminho protegido (Cloudinary privado + Worker)
  if (type === "video"){ sendVideoSigned(file); event.target.value = ""; return; }

  // O Cloudinary bloqueia certas extensões (apk, exe, etc.) por segurança.
  // Contorno: renomeia escondendo a extensão antes de enviar; quem recebe
  // precisa apagar o ".zip" do final do nome depois de baixar.
  const blocked = type === "file" && isBlockedExt(file.name);
  const uploadTarget = blocked ? new File([file], file.name + ".zip", { type: file.type }) : file;

  const status = document.getElementById("uploadStatus");
  status.style.display = "block";
  status.textContent = "enviando... 0%";

  const formData = new FormData();
  formData.append("file", uploadTarget);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      status.textContent = "enviando... " + pct + "%";
    }
  };

  xhr.onload = () => {
    status.style.display = "none";
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      pushMessage({ type: type, url: res.secure_url, fileName: file.name, renamed: blocked });
    } else {
      let detail = xhr.responseText;
      try { detail = JSON.parse(xhr.responseText).error.message; } catch(e){}
      alert("Falha ao enviar arquivo (" + xhr.status + "): " + detail);
    }
  };

  xhr.onerror = () => {
    status.style.display = "none";
    alert("Falha de conexão ao enviar o arquivo.");
  };

  xhr.send(formData);
  event.target.value = "";
}

/* ================= FIGURINHAS =================
   Packs de figurinhas compartilhados com todo mundo do clã, guardados
   no Firebase em stickerPacks/{packId}/stickers/{stickerId}. Qualquer
   um pode criar um pack novo e adicionar figurinhas nele. "Criar
   figurinha" pega qualquer imagem, encaixa ela num quadrado 512x512
   (com fundo transparente, tipo as figurinhas do WhatsApp) e sobe pro
   Cloudinary antes de salvar a referência no pack escolhido. */
let stickerPacksCache = {};
let selectedPackId = null;
let stickerManageMode = false;
let stickerListenerAttached = false;
let pendingStickerPack = null;

function openStickerPanel(){
  document.getElementById("stickerPanel").style.display = "flex";
  if (!stickerListenerAttached){
    stickerListenerAttached = true;
    db.ref("stickerPacks").on("value", snap => {
      stickerPacksCache = snap.val() || {};
      if (!selectedPackId || !stickerPacksCache[selectedPackId]){
        selectedPackId = Object.keys(stickerPacksCache)[0] || null;
      }
      renderPackTabs();
      renderStickerGrid();
    });
  }
}

function closeStickerPanel(){
  document.getElementById("stickerPanel").style.display = "none";
  stickerManageMode = false;
  document.getElementById("stickerSheet").classList.remove("manage");
  document.getElementById("manageBtn").classList.remove("active");
}

function toggleManageMode(){
  stickerManageMode = !stickerManageMode;
  document.getElementById("stickerSheet").classList.toggle("manage", stickerManageMode);
  document.getElementById("manageBtn").classList.toggle("active", stickerManageMode);
  renderPackTabs();
}

function renderPackTabs(){
  const wrap = document.getElementById("packTabs");
  const packIds = Object.keys(stickerPacksCache);
  wrap.innerHTML = packIds.map(id => {
    const p = stickerPacksCache[id] || {};
    const sel = id === selectedPackId ? " selected" : "";
    const delBtn = stickerManageMode
      ? ` <span onclick="event.stopPropagation();deletePack('${id}')">✕</span>` : "";
    return `<div class="packTab${sel}" onclick="selectPack('${id}')">${escapeHtml(p.name || "Pack")}${delBtn}</div>`;
  }).join("") + `<div class="packTab addPack" onclick="createPack()">+ novo pack</div>`;
}

function selectPack(id){
  selectedPackId = id;
  renderPackTabs();
  renderStickerGrid();
}

function createPack(){
  const name = prompt("Nome do novo pack de figurinhas:");
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  db.ref("stickerPacks").push({ name: trimmed, createdBy: currentUser, createdAt: Date.now() })
    .then(ref => { selectedPackId = ref.key; });
}

function deletePack(id){
  if (!confirm("Excluir esse pack de figurinhas inteiro?")) return;
  db.ref("stickerPacks/" + id).remove();
  if (selectedPackId === id) selectedPackId = null;
}

function renderStickerGrid(){
  const grid = document.getElementById("stickerGrid");
  if (!selectedPackId){
    grid.innerHTML = `<div id="stickerEmptyHint">Nenhum pack ainda. Toque em "+ novo pack" pra criar o primeiro.</div>`;
    return;
  }
  const pack = stickerPacksCache[selectedPackId] || {};
  const stickers = pack.stickers || {};
  const ids = Object.keys(stickers);

  let html = ids.length ? "" : `<div id="stickerEmptyHint">Esse pack ainda não tem figurinhas. Toque no + pra criar a primeira.</div>`;
  html += ids.map(sid => `
      <div class="stickerTile">
        <div class="stickerTileInner">
          <img src="${stickers[sid].url}" onclick="sendSticker('${stickers[sid].url}')">
          <button class="stickerDelete" onclick="deleteSticker('${selectedPackId}','${sid}')">✕</button>
        </div>
      </div>`).join("");
  html += `<div class="stickerTile addSticker" onclick="triggerAddSticker('${selectedPackId}')"><div class="stickerTileInner">+</div></div>`;
  grid.innerHTML = html;
}

function deleteSticker(packId, stickerId){
  if (!confirm("Excluir essa figurinha?")) return;
  db.ref("stickerPacks/" + packId + "/stickers/" + stickerId).remove();
}

function sendSticker(url){
  pushMessage({ type: "sticker", url: url });
  closeStickerPanel();
}

/* ---- criar figurinha a partir de qualquer imagem ---- */
function triggerAddSticker(packId){
  pendingStickerPack = packId;
  document.getElementById("stickerFileInput").click();
}

function handleStickerUpload(event){
  const file = event.target.files[0];
  event.target.value = "";
  if (!file || !pendingStickerPack) return;
  if (!file.type.startsWith("image/")) {
    alert("Escolha uma imagem pra virar figurinha.");
    return;
  }

  const reader = new FileReader();
  reader.onload = (e) => {
    const img = new Image();
    img.onload = () => {
      // encaixa a imagem inteira num quadrado 512x512 com fundo
      // transparente, do jeito que as figurinhas costumam vir.
      const SIZE = 512;
      const canvas = document.createElement("canvas");
      canvas.width = SIZE; canvas.height = SIZE;
      const ctx = canvas.getContext("2d");
      const scale = Math.min(SIZE / img.width, SIZE / img.height);
      const w = img.width * scale, h = img.height * scale;
      ctx.drawImage(img, (SIZE - w) / 2, (SIZE - h) / 2, w, h);
      canvas.toBlob(blob => uploadSticker(blob), "image/png");
    };
    img.onerror = () => alert("Não foi possível ler essa imagem.");
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}

function uploadSticker(blob){
  const packId = pendingStickerPack;
  const headerTitle = document.querySelector("#stickerSheetHeader b");
  const original = headerTitle.textContent;
  headerTitle.textContent = "Criando figurinha...";

  const formData = new FormData();
  formData.append("file", blob, "sticker.png");
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");
  xhr.onload = () => {
    headerTitle.textContent = original;
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("stickerPacks/" + packId + "/stickers").push({ url: res.secure_url, addedBy: currentUser });
    } else {
      alert("Falha ao criar a figurinha.");
    }
  };
  xhr.onerror = () => { headerTitle.textContent = original; alert("Falha de conexão ao criar a figurinha."); };
  xhr.send(formData);
}

/* ================= SALA DE VÍDEO (CALL) =================
   Chamada em grupo via WebRTC (mesh: todo mundo conecta com todo
   mundo direto), usando o próprio Firebase como "sinalizador" pra
   trocar as informações de conexão. Não usa servidor nenhum além
   do que vocês já têm. Funciona bem pra grupos pequenos (tipo o
   clã de vocês). Sem servidor TURN: em redes com NAT/firewall bem
   restritivo (ex: 4G de operadora, wifi corporativo) a conexão
   direta pode falhar — em wifi doméstico normal funciona certo.

   Adicionar vídeo: qualquer um na sala pode tocar no botão 🎬+ e
   colar um link direto de arquivo de vídeo (o mesmo tipo de link
   que o Cloudinary gera quando alguém manda um vídeo no chat — pode
   subir os vídeos lá e colar o link). É pedida a senha "1998" antes
   de adicionar. O vídeo entra pra lista de todo mundo, e só o admin
   da sala (quem entrou primeiro) escolhe qual tocar. */
let mediaLibrary = {}; // { id: { title, url, addedBy } }, carregada da lib do Firebase (videoLibrary ou musicLibrary)

const ICE_SERVERS = { iceServers: [{ urls: "stun:stun.l.google.com:19302" }] };

let callPeers = {};         // { usuario: RTCPeerConnection }
let localStream = null;
let audioCtx = null;        // usado só pro detector de "quem tá falando" (anel verde no avatar)
let callParticipants = {};  // snapshot atual de <currentRoomPath>/participants
let callAmIAdmin = false;
let isMicMuted = false;
let isDeafened = false;
let playerSyncTimer = null;
let callChatOpen = false;
let callChatJoinedAt = 0;
let callChatLastSeenAt = 0;
let callChatListenerRef = null;

let currentRoomPath = "callRoom";     // "callRoom" (vídeo) ou "musicRoom" (música)
let currentLibraryPath = "videoLibrary"; // "videoLibrary" ou "musicLibrary"

function openCallRoom(roomPath, libraryPath, title){
  currentRoomPath = roomPath || "callRoom";
  currentLibraryPath = libraryPath || "videoLibrary";
  const isMusic = currentLibraryPath === "musicLibrary";

  document.getElementById("listView").style.display = "none";
  document.getElementById("chatView").style.display = "none";
  document.getElementById("callView").style.display = "flex";
  document.getElementById("callTitle").textContent = title || "📹 Sala de Vídeo";
  document.getElementById("playerOverlay").textContent =
    "Aguardando o admin escolher " + (isMusic ? "uma música" : "um vídeo") + "…";
  document.getElementById("addVideoBtn").textContent = isMusic ? "🎵+" : "🎬+";
  document.getElementById("addVideoBtn").title = isMusic ? "Adicionar música" : "Adicionar vídeo";
  document.getElementById("animeBtn").style.display = isMusic ? "none" : "block";
  document.getElementById("musicFileInput").accept = "audio/*";

  navigator.mediaDevices.getUserMedia({ audio: true })
    .then(stream => {
      localStream = stream;
      renderParticipantTile(currentUser, stream, true);
      joinCallSignaling();
    })
    .catch(() => {
      // sem microfone (ou usuário negou o acesso): entra mesmo assim,
      // só que sem poder falar. Continua ouvindo e vendo os vídeos
      // compartilhados normalmente, como ouvinte.
      localStream = null;
      isMicMuted = true;
      document.getElementById("micBtn").textContent = "🔇";
      renderParticipantTile(currentUser, null, true);
      joinCallSignaling();
    });
}

function joinCallSignaling(){
  const myRef = db.ref(currentRoomPath + "/participants/" + currentUser);
  myRef.onDisconnect().remove();
  myRef.set({ joinedAt: firebase.database.ServerValue.TIMESTAMP, micMuted: isMicMuted });

  db.ref(currentRoomPath + "/participants").on("value", snap => {
    callParticipants = snap.val() || {};
    updateAdminStatus();
    syncPeerConnections();
    removeStaleTiles();
    updateMicBadges();
    if (!Object.keys(callParticipants).length) {
      db.ref(currentRoomPath + "/player").remove();
    }
  });

  db.ref(currentLibraryPath).on("value", snap => {
    mediaLibrary = snap.val() || {};

/* ---- conexões WebRTC (mesh) ---- */
function syncPeerConnections(){
  const others = Object.keys(callParticipants).filter(u => u !== currentUser);
  others.forEach(u => { if (!callPeers[u]) createPeerConnection(u); });
  Object.keys(callPeers).forEach(u => {
    if (!others.includes(u)) closePeerConnection(u);
  });
}

function createPeerConnection(peerUser){
  const pc = new RTCPeerConnection(ICE_SERVERS);
  callPeers[peerUser] = pc;

  // "Negociação perfeita": os dois lados podem mandar oferta agora (não só
  // o de nome menor). Isso é o que permite a conexão se recuperar sozinha
  // quando cai — antes só um lado sabia renegociar, então se a ligação
  // caísse com 3 pessoas na sala, um dos dois sumia e não voltava mais.
  // Em caso de colisão (os dois ofertando ao mesmo tempo), o "impolite"
  // (nome alfabeticamente menor) vence e o "polite" descarta a própria
  // oferta e aceita a do outro.
  pc.isPolite = currentUser > peerUser;
  pc.makingOffer = false;
  pc.ignoreOffer = false;

  pc.ontrack = (event) => renderParticipantTile(peerUser, event.streams[0], false);

  pc.onicecandidate = (event) => {
    if (event.candidate) {
      db.ref(currentRoomPath + "/signals/" + peerUser + "/" + currentUser + "/candidates").push(event.candidate.toJSON());
    }
  };

  pc.onnegotiationneeded = async () => {
    try {
      pc.makingOffer = true;
      const offer = await pc.createOffer();
      if (pc.signalingState !== "stable") return;
      await pc.setLocalDescription(offer);
      db.ref(currentRoomPath + "/signals/" + peerUser + "/" + currentUser + "/offer").set({ sdp: offer.sdp, type: offer.type });
    } catch(e){ console.error(e); }
    finally { pc.makingOffer = false; }
  };

  // Se a conexão cair (rede instável, trio esbarrando um no outro etc.),
  // tenta reconectar sozinho em vez de deixar o participante sumido pro
  // resto da call.
  pc.oniceconnectionstatechange = () => {
    if (pc.iceConnectionState === "failed") {
      try { pc.restartIce(); } catch(e){}
    }
  };
  pc.onconnectionstatechange = () => {
    if (pc.connectionState === "failed") {
      setTimeout(() => {
        if (callParticipants[peerUser] && callPeers[peerUser] === pc) {
          closePeerConnection(peerUser);
          createPeerConnection(peerUser);
        }
      }, 1200);
    }
  };

  if (localStream) {
    localStream.getTracks().forEach(track => pc.addTrack(track, localStream));
  } else {
    // Sem microfone (ouvinte): sem nenhuma track, o navegador nunca dispara
    // "negotiationneeded" sozinho, então a conexão com esse usuário nunca
    // chegava a começar. Um canal de dados vazio força a negociação a
    // acontecer mesmo assim.
    pc.createDataChannel("keepalive");
  }

  return pc;
}

function closePeerConnection(peerUser){
  if (callPeers[peerUser]) { callPeers[peerUser].close(); delete callPeers[peerUser]; }
  const tile = document.getElementById("tile-" + peerUser);
  if (tile) tile.remove();
  const inboxRef = db.ref(currentRoomPath + "/signals/" + currentUser + "/" + peerUser);
  inboxRef.child("offer").off();
  inboxRef.child("answer").off();
  inboxRef.child("candidates").off();
  inboxRef.off();
  inboxRef.remove();
}

function listenForSignals(){
  db.ref(currentRoomPath + "/signals/" + currentUser).on("child_added", (fromSnap) => {
    const peerUser = fromSnap.key;

    fromSnap.ref.child("offer").on("value", async (offerSnap) => {
      const offer = offerSnap.val();
      if (!offer) return;
      let pc = callPeers[peerUser];
      if (!pc) pc = createPeerConnection(peerUser);

      const offerCollision = pc.makingOffer || pc.signalingState !== "stable";
      pc.ignoreOffer = !pc.isPolite && offerCollision;
      if (pc.ignoreOffer) return;

      try {
        if (offerCollision) {
          await Promise.all([
            pc.setLocalDescription({ type: "rollback" }),
            pc.setRemoteDescription(new RTCSessionDescription(offer))
          ]);
        } else {
          await pc.setRemoteDescription(new RTCSessionDescription(offer));
        }
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
        db.ref(currentRoomPath + "/signals/" + peerUser + "/" + currentUser + "/answer").set({ sdp: answer.sdp, type: answer.type });
      } catch(e){ console.error(e); }
    });

    fromSnap.ref.child("answer").on("value", async (answerSnap) => {
      const answer = answerSnap.val();
      const pc = callPeers[peerUser];
      if (!answer || !pc) return;
      if (pc.signalingState === "have-local-offer" || pc.signalingState === "have-remote-pranswer") {
        try { await pc.setRemoteDescription(new RTCSessionDescription(answer)); }
        catch(e){ console.error(e); }
      }
    });

    fromSnap.ref.child("candidates").on("child_added", (candSnap) => {
      const pc = callPeers[peerUser];
      if (!pc) return;
      pc.addIceCandidate(new RTCIceCandidate(candSnap.val())).catch(e => {
        if (!pc.ignoreOffer) console.error(e);
      });
    });
  });
}

/* ---- detector de "quem tá falando" (anel verde no avatar, tipo Discord) ---- */
function getAudioContext(){
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}

function attachSpeakingDetector(user, stream){
  if (!stream || !stream.getAudioTracks().length) return;
  const streamId = stream.id;
  try {
    const ctx = getAudioContext();
    const source = ctx.createMediaStreamSource(stream);
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 512;
    analyser.smoothingTimeConstant = 0.6;
    source.connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    (function tick(){
      const tile = document.getElementById("tile-" + user);
      if (!tile || tile.dataset.speakingStream !== streamId) return;
      analyser.getByteFrequencyData(data);
      const avg = data.reduce((a, b) => a + b, 0) / data.length;
      const wrap = tile.querySelector(".callTileAvatarWrap");
      const muted = user === currentUser ? isMicMuted : !!(callParticipants[user] && callParticipants[user].micMuted);
      if (wrap) wrap.classList.toggle("speaking", avg > 12 && !muted);
      requestAnimationFrame(tick);
    })();
  } catch(e){ console.error(e); }
}

function handleMusicUpload(event){
  const file = event.target.files[0];
  if (!file) { event.target.value = ""; return; }

  const pass = prompt("Senha pra adicionar música:");
  if (pass === null) { event.target.value = ""; return; }
  if (pass !== "1998"){ alert("Senha incorreta."); event.target.value = ""; return; }
  const title = prompt("Nome da música (vai aparecer na lista):");
  if (title === null) { event.target.value = ""; return; }
  const trimmedTitle = title.trim();
  if (!trimmedTitle) { event.target.value = ""; return; }

  const status = document.getElementById("callMusicUploadStatus");
  status.style.display = "block";
  status.textContent = "enviando \"" + trimmedTitle + "\"... 0%";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      status.textContent = "enviando \"" + trimmedTitle + "\"... " + pct + "%";
    }
  };

  xhr.onload = () => {
    status.style.display = "none";
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("musicLibrary").push({ title: trimmedTitle, url: res.secure_url, addedBy: currentUser });
      alert("Música adicionada! O admin da sala já consegue escolher ela na lista.");
    } else {
      let detail = xhr.responseText;
      try { detail = JSON.parse(xhr.responseText).error.message; } catch(e){}
      alert("Falha ao enviar a música (" + xhr.status + "): " + detail);
    }
  };

  xhr.onerror = () => {
    status.style.display = "none";
    alert("Falha de conexão ao enviar a música.");
  };

  xhr.send(formData);
  event.target.value = "";
}

function adminTogglePlay(){

  db.ref(currentRoomPath + "/player").once("value", snap => {

    if (!state) return;
    db.ref(currentRoomPath + "/player").update({
      playing: !state.playing,

    });
  });

function adminSeek(){
  const bar = document.getElementById("seekBar");
  const player = document.getElementById("sharedPlayer");
  const newTime = (bar.value / 100) * (player.duration || 0);
  db.ref(currentRoomPath + "/player").update({
    time: newTime,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function adminSeekBy(deltaSeconds){
  const player = document.getElementById("sharedPlayer");
  if (!player.duration) return;
  const newTime = Math.max(0, Math.min(player.duration, player.currentTime + deltaSeconds));
  player.currentTime = newTime;
  const bar = document.getElementById("seekBar");
  bar.value = (newTime / player.duration) * 100;
  db.ref(currentRoomPath + "/player").update({
    time: newTime,
    updatedAt: firebase.database.ServerValue.TIMESTAMP
  });
}

function listenForPlayerState(){
  db.ref(currentRoomPath + "/player").on("value", snap => {
    const state = snap.val();
    const player = document.getElementById("sharedPlayer");
    const overlay = document.getElementById("playerOverlay");
    if (!state || !state.videoId) {
      overlay.style.display = "flex";
      return;
    }
    const media = mediaLibrary[state.videoId];
    if (!media) return;
    overlay.style.display = "none";
    if (player.dataset.currentId !== state.videoId) {
      player.dataset.currentId = state.videoId;
      if (media.vid){
        player.removeAttribute("src");
        vidApi("/play", { v: media.vid }).then(j => { player.src = j.url; }).catch(() => {});
      } else {
        player.src = media.url;
      }
    }
    const drift = state.playing ? (Date.now() - (state.updatedAt || Date.now())) / 1000 : 0;
    const expected = (state.time || 0) + Math.max(drift, 0);
    if (Math.abs(player.currentTime - expected) > 1.2) player.currentTime = expected;
    if (state.playing && player.paused) player.play().catch(() => {});
    if (!state.playing && !player.paused) player.pause();
    document.getElementById("playPauseBtn").textContent = state.playing ? "⏸" : "▶";
  });

  // a cada 5s o admin reenvia a posição atual, pra corrigir qualquer
  // desalinhamento de quem entrou depois ou teve uma conexão mais lenta
  playerSyncTimer = setInterval(() => {
    if (!callAmIAdmin) return;
    const player = document.getElementById("sharedPlayer");
    if (player.paused || !player.dataset.currentId) return;
    db.ref(currentRoomPath + "/player").update({ time: player.currentTime, updatedAt: firebase.database.ServerValue.TIMESTAMP });
  }, 5000);

  document.getElementById("sharedPlayer").addEventListener("timeupdate", () => {
    if (!callAmIAdmin) return;
    const player = document.getElementById("sharedPlayer");
    const bar = document.getElementById("seekBar");
    if (player.duration) bar.value = (player.currentTime / player.duration) * 100;
  });
}

function playAnimeEpisode(epId){
  const anime = myAnimeLibrary[currentAnimeId];
  const ep = anime && anime.episodes ? anime.episodes[epId] : null;
  if (!ep) return;
  document.getElementById("animeHeaderTitle").textContent = `🍥 ${anime.name || "Anime"} · ${ep.title || ""}`;
  const wrap = document.getElementById("animeFrameWrap");
  const player = document.getElementById("animeVideoPlayer");
  wrap.style.display = "block";
  document.getElementById("animePanel").classList.add("anime-frame-open");
  if (ep.vid){
    player.removeAttribute("src");
    vidApi("/play", { v: ep.vid }).then(j => { player.src = j.url; player.play().catch(() => {}); player.addEventListener("error", () => explainVideoError(j.url), { once: true }); }).catch(e => alert("Não consegui abrir o episódio: " + e.message));
  } else {
    player.src = ep.url;
    player.play().catch(() => {});
  }
  currentPlayingEpisode = {
    title: (anime.name || "Anime") + " · " + (ep.title || ""),
    url: ep.url || "",
    vid: ep.vid || ""
  };
}

function sendEpisodeToCallRoom(){
  if (!currentPlayingEpisode) return;
  const item = { title: currentPlayingEpisode.title, addedBy: currentUser };
  if (currentPlayingEpisode.vid) item.vid = currentPlayingEpisode.vid; else item.url = currentPlayingEpisode.url;
  db.ref("videoLibrary").push(item);
  alert("Episódio enviado pra Sala de Vídeo! Entra lá que o admin da call já consegue escolher ele na lista pra assistir com todo mundo.");
}

function promptAddAnime(){
  if (!isStaff(currentUser)){
    const pass = prompt("Senha pra adicionar anime:");
    if (pass === null) return;
    if (pass !== "1998"){ alert("Senha incorreta."); return; }
  }
  const name = prompt("Nome do anime:");
  if (name === null) return;
  const trimmed = name.trim();
  if (!trimmed) return;
  db.ref("myAnimes").push({ name: trimmed, addedBy: currentUser });
}

function promptAddEpisode(){
  if (!currentAnimeId) return;
  document.getElementById("animeEpisodeFileInput").click();
}

function handleAnimeEpisodeUpload(event){
  const file = event.target.files[0];
  const animeId = currentAnimeId;
  if (!file || !animeId) { event.target.value = ""; return; }

  if (!isStaff(currentUser)){
    const pass = prompt("Senha pra adicionar episódio:");
    if (pass === null) { event.target.value = ""; return; }
    if (pass !== "1998"){ alert("Senha incorreta."); event.target.value = ""; return; }
  }
  const title = prompt("Nome/número do episódio (ex: EP 1):");
  if (title === null) { event.target.value = ""; return; }
  const trimmedTitle = title.trim();
  if (!trimmedTitle) { event.target.value = ""; return; }

  const status = document.getElementById("animeUploadStatus");
  status.style.display = "block";
  status.textContent = "enviando \"" + trimmedTitle + "\"... 0%";

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);

  const xhr = new XMLHttpRequest();
  xhr.open("POST", "https://api.cloudinary.com/v1_1/" + CLOUDINARY_CLOUD_NAME + "/auto/upload");

  xhr.upload.onprogress = (e) => {
    if (e.lengthComputable){
      const pct = Math.round((e.loaded / e.total) * 100);
      status.textContent = "enviando \"" + trimmedTitle + "\"... " + pct + "%";
    }
  };

  xhr.onload = () => {
    status.style.display = "none";
    if (xhr.status >= 200 && xhr.status < 300){
      const res = JSON.parse(xhr.responseText);
      db.ref("myAnimes/" + animeId + "/episodes").push({
        title: trimmedTitle,
        url: res.secure_url,
        order: Date.now(),
        addedBy: currentUser
      });
    } else {
      let detail = xhr.responseText;
      try { detail = JSON.parse(xhr.responseText).error.message; } catch(e){}
      alert("Falha ao enviar o episódio (" + xhr.status + "): " + detail);
    }
  };

  xhr.onerror = () => {
    status.style.display = "none";
    alert("Falha de conexão ao enviar o episódio.");
  };

  xhr.send(formData);
  event.target.value = "";
}

function promptDeleteAnime(){
  if (!currentAnimeId) return;
  if (!isStaff(currentUser)){
    const pass = prompt("Senha pra apagar esse anime (e todos os episódios):");
    if (pass === null) return;
    if (pass !== "1998"){ alert("Senha incorreta."); return; }
  }
  if (!confirm("Tem certeza que quer apagar esse anime?")) return;
  db.ref("myAnimes/" + currentAnimeId).remove();
  backToAnimeList();
}


/* ---------------- UTIL ---------------- */
function escapeHtml(str){
  const d = document.createElement("div");
  d.textContent = str;
  return d.innerHTML;
}
